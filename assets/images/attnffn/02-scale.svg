<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">sqrt(d_k) 是刻度，不是防溢出</title><desc id="desc">有效位置数 = exp(熵)。T = 4096、d_k = 64 时，三个刻度给出三种完全不同的注意力。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="680" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTN-FFN / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">sqrt(d_k) 是刻度，不是防溢出</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">有效位置数 = exp(熵)。T = 4096、d_k = 64 时，三个刻度给出三种完全不同的注意力。</text><rect x="40" y="146" width="620" height="410" rx="12" fill="#f7f9fc" stroke="none"/><path d="M108 520 L620 520" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M108 520 L108 196" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M108.0 520 L108.0 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="108.0" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">2</text><path d="M154.54545454545456 520 L154.54545454545456 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M201.0909090909091 520 L201.0909090909091 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="201.0909090909091" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">8</text><path d="M247.63636363636363 520 L247.63636363636363 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M294.1818181818182 520 L294.1818181818182 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="294.1818181818182" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">32</text><path d="M340.72727272727275 520 L340.72727272727275 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M387.27272727272725 520 L387.27272727272725 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="387.27272727272725" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">128</text><path d="M433.8181818181818 520 L433.8181818181818 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M480.3636363636364 520 L480.3636363636364 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="480.3636363636364" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">512</text><path d="M526.909090909091 520 L526.909090909091 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M573.4545454545455 520 L573.4545454545455 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="573.4545454545455" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">2048</text><path d="M620.0 520 L620.0 525" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M103 520.0 L108 520.0" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="525.0" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">1</text><path d="M103 470.15384615384613 L108 470.15384615384613" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="475.15384615384613" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">4</text><path d="M103 420.3076923076923 L108 420.3076923076923" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="425.3076923076923" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">16</text><path d="M103 370.46153846153845 L108 370.46153846153845" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="375.46153846153845" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">64</text><path d="M103 320.61538461538464 L108 320.61538461538464" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="325.61538461538464" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">256</text><path d="M103 270.7692307692307 L108 270.7692307692307" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="275.7692307692307" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">1024</text><path d="M103 220.9230769230769 L108 220.9230769230769" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="97" y="225.9230769230769" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="end">4096</text><text x="364.0" y="574" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">上下文长度 T</text><polyline points="108.0,516.6 154.5,513.7 201.1,507.6 247.6,500.9 294.2,500.7 340.7,494.0 387.3,494.4 433.8,489.9 480.4,478.4 526.9,481.7 573.5,476.4 620.0,471.2" fill="none" stroke="#c88735" stroke-width="3"/><polyline points="108.0,500.9 154.5,479.6 201.1,457.7 247.6,435.4 294.2,411.5 340.7,388.2 387.3,363.0 433.8,337.8 480.4,313.8 526.9,288.6 573.5,263.5 620.0,238.2" fill="none" stroke="#218575" stroke-width="3"/><rect x="64" y="166" width="306" height="74" rx="10" fill="#ffffff" stroke="none"/><path d="M78 192 L118 192" fill="none" stroke="#218575" stroke-width="3"/><text x="128" y="197" font-size="15" fill="#218575" font-weight="600" text-anchor="start">除以 sqrt(d_k) = 8</text><path d="M78 220 L118 220" fill="none" stroke="#c88735" stroke-width="3"/><text x="128" y="225" font-size="15" fill="#c88735" font-weight="600" text-anchor="start">不缩放（除以 1）</text><text x="616" y="224.22241530663337" font-size="16" fill="#218575" font-weight="600" text-anchor="end">2531.70</text><text x="616" y="459.24904958602934" font-size="16" fill="#c88735" font-weight="600" text-anchor="end">3.88</text><text x="616" y="437.24904958602934" font-size="14" fill="#c88735" font-weight="500" text-anchor="end">T 涨 2048 倍，只从 1.10 爬到 3.88</text><rect x="684" y="146" width="276" height="410" rx="12" fill="#f1f4fb" stroke="none"/><text x="708" y="180" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">T = 4096 时的三个刻度</text><path d="M708 180 L936 180" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="708" y="214" font-size="16" fill="#c88735" font-weight="600" text-anchor="start">除以 1</text><text x="708" y="240" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">平均最大权重 0.6890</text><text x="708" y="268" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">3.43 个位置</text><text x="936" y="268" font-size="15" fill="#c88735" font-weight="600" text-anchor="end">0.08%</text><path d="M708 288 L936 288" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="708" y="322" font-size="16" fill="#218575" font-weight="600" text-anchor="start">除以 sqrt(d_k) = 8</text><text x="708" y="348" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">平均最大权重 0.0060</text><text x="708" y="376" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">2502.30 个位置</text><text x="936" y="376" font-size="15" fill="#218575" font-weight="600" text-anchor="end">61.09%</text><path d="M708 396 L936 396" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="708" y="430" font-size="16" fill="#4967b0" font-weight="600" text-anchor="start">除以 d_k = 64</text><text x="708" y="456" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">平均最大权重 0.0004</text><text x="708" y="484" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">4063.65 个位置</text><text x="936" y="484" font-size="15" fill="#4967b0" font-weight="600" text-anchor="end">99.21%</text><text x="708" y="528" font-size="14" fill="#4967b0" font-weight="500" text-anchor="start">几乎均匀 = 平均池化</text><text x="40" y="600" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">不缩放时模型实际只看两三个 token，把上下文从 4K 扩到 128K 是白费力气；除以 d_k 又矫枉过正，注意力失去选择性。</text><text x="40" y="628" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">换算方式：对 q、k 各分量取独立 N(0,1)，每项乘积方差为 1，d_k 项相加即方差 d_k。20 万次采样实测 63.818。</text></g></svg>