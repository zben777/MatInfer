<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">2/3 正在漂移：GQA 砍掉的是 Attention 那一侧</title><desc id="desc">只统计注意力投影与 FFN 权重，忽略 bias、Norm、Embedding 与 LM Head。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTN-FFN / 06</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">2/3 正在漂移：GQA 砍掉的是 Attention 那一侧</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">只统计注意力投影与 FFN 权重，忽略 bias、Norm、Embedding 与 LM Head。</text><rect x="640" y="138" width="14" height="14" rx="3" fill="#4967b0" stroke="none"/><text x="662" y="150" font-size="14" fill="#4967b0" font-weight="600" text-anchor="start">Attention</text><rect x="766" y="138" width="14" height="14" rx="3" fill="#218575" stroke="none"/><text x="788" y="150" font-size="14" fill="#218575" font-weight="600" text-anchor="start">FFN</text><rect x="40" y="164" width="920" height="88" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="200" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">原始 Transformer</text><text x="64" y="226" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">MHA · ReLU · m = 4d</text><rect x="300" y="190" width="139.98599999999996" height="30" rx="4" fill="#4967b0" stroke="none"/><rect x="439.986" y="190" width="280.014" height="30" rx="4" fill="#218575" stroke="none"/><text x="738" y="214" font-size="20" fill="#218575" font-weight="600" text-anchor="start">66.67%</text><text x="300" y="242" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">Attention 1.05 M　·　FFN 2.1 M　·　合计 3.15 M</text><rect x="40" y="268" width="920" height="88" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="304" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">GPT-2 small</text><text x="64" y="330" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">MHA · GELU · m = 4d</text><rect x="300" y="294" width="139.98599999999996" height="30" rx="4" fill="#4967b0" stroke="none"/><rect x="439.986" y="294" width="280.014" height="30" rx="4" fill="#218575" stroke="none"/><text x="738" y="318" font-size="20" fill="#218575" font-weight="600" text-anchor="start">66.67%</text><text x="300" y="346" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">Attention 2.36 M　·　FFN 4.72 M　·　合计 7.08 M</text><rect x="40" y="372" width="920" height="88" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="408" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">Llama-3-8B</text><text x="64" y="434" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">GQA-4 · SwiGLU · m = 3.5d</text><rect x="300" y="398" width="80.766" height="30" rx="4" fill="#4967b0" stroke="none"/><rect x="380.766" y="398" width="339.234" height="30" rx="4" fill="#218575" stroke="none"/><text x="738" y="422" font-size="20" fill="#218575" font-weight="600" text-anchor="start">80.77%</text><text x="300" y="450" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">Attention 41.94 M　·　FFN 176.16 M　·　合计 218.1 M</text><rect x="40" y="486" width="920" height="56" rx="10" fill="#fbf3e6" stroke="none"/><text x="64" y="522" font-size="16" fill="#c88735" font-weight="600" text-anchor="start">K/V 投影从 4 个 d×d 降到 4 分之一，SwiGLU 却仍占 3dm ≈ 8d² —— FFN 的份额于是被抬了起来。</text></g></svg>