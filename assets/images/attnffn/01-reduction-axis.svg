<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">层里只有一条归约轴随输入变长</title><desc id="desc">把&quot;跨位置&quot;换成能算的判据：这条求和轴的长度，会不会跟着上下文一起变？</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTN-FFN / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">层里只有一条归约轴随输入变长</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">把&quot;跨位置&quot;换成能算的判据：这条求和轴的长度，会不会跟着上下文一起变？</text><text x="40" y="152" font-size="16" fill="#4967b0" font-weight="600" text-anchor="start">Attention</text><text x="508" y="152" font-size="16" fill="#218575" font-weight="600" text-anchor="start">FFN</text><rect x="500" y="160" width="468" height="146" rx="12" fill="#eef4f0" stroke="none"/><rect x="188" y="160" width="156" height="146" rx="12" fill="#fdf4e7" stroke="none"/><rect x="40" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="110.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">分数</text><text x="110.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">q · kᵀ</text><rect x="40" y="260" width="140" height="30" rx="8" fill="#e8edf4" stroke="none"/><text x="110.0" y="280" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">归约轴 d_h</text><rect x="196" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="266.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">分母</text><text x="266.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">softmax  Z</text><rect x="196" y="260" width="140" height="30" rx="8" fill="#e8cfa8" stroke="none"/><text x="266.0" y="280" font-size="15" fill="#c88735" font-weight="600" text-anchor="middle">归约轴 T</text><rect x="352" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="422.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">聚合</text><text x="422.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">A · V</text><rect x="352" y="260" width="140" height="30" rx="8" fill="#e8edf4" stroke="none"/><text x="422.0" y="280" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">归约轴 d_h</text><rect x="508" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="578.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">升维</text><text x="578.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">u · W₁</text><rect x="508" y="260" width="140" height="30" rx="8" fill="#e8edf4" stroke="none"/><text x="578.0" y="280" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">归约轴 d</text><rect x="664" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="734.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">激活</text><text x="734.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">SiLU</text><rect x="664" y="260" width="140" height="30" rx="8" fill="#e8edf4" stroke="none"/><text x="734.0" y="280" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">归约轴 ——</text><rect x="820" y="174" width="140" height="74" rx="12" fill="#f7f9fc" stroke="none"/><text x="890.0" y="206" font-size="19" fill="#24334a" font-weight="600" text-anchor="middle">降维</text><text x="890.0" y="232" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">· W₂</text><rect x="820" y="260" width="140" height="30" rx="8" fill="#e8edf4" stroke="none"/><text x="890.0" y="280" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">归约轴 m</text><text x="40" y="356" font-size="18" fill="#c88735" font-weight="600" text-anchor="start">唯一随输入变长的一条</text><text x="40" y="386" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">softmax 的分母要等整行到齐才算得出来，所以它是这一层里唯一不能随便切的运算。</text><text x="40" y="412" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">分数与聚合虽然也涉及两个位置，但每个 (i, j) 对算完就能扔，可以任意并行。</text><rect x="40" y="438" width="920" height="116" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="474" font-size="17" fill="#4967b0" font-weight="600" text-anchor="start">判据</text><text x="64" y="502" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">归约轴长度随输入变化  →  跨位置  →  需要历史  →  需要 KV Cache，且切分要特殊处理</text><text x="64" y="530" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">归约轴长度写死在配置里  →  逐位置  →  无缓存  →  宽度、路由方式都可以自由改</text></g></svg>