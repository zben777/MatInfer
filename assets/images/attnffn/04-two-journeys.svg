<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">同一行数据，先被横向改写，再被纵向加工</title><desc id="desc">d = 512，8 个头，d_h = 64，处理第 4 个位置。全程只有当前这一行被写出去。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="560" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTN-FFN / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">同一行数据，先被横向改写，再被纵向加工</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">d = 512，8 个头，d_h = 64，处理第 4 个位置。全程只有当前这一行被写出去。</text><rect x="40" y="146" width="440" height="322" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="182" font-size="20" fill="#4967b0" font-weight="600" text-anchor="start">Attention：横向读历史</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">每个头各自与全部可见位置配对</text><rect x="78" y="224" width="72" height="46" rx="12" fill="#eef1f6" stroke="none"/><text x="114" y="252" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">K/V 1</text><path d="M114 270 L114 286" fill="none" stroke="#b3becc" stroke-width="1"/><rect x="174" y="224" width="72" height="46" rx="12" fill="#eef1f6" stroke="none"/><text x="210" y="252" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">K/V 2</text><path d="M210 270 L210 286" fill="none" stroke="#b3becc" stroke-width="1"/><rect x="270" y="224" width="72" height="46" rx="12" fill="#eef1f6" stroke="none"/><text x="306" y="252" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">K/V 3</text><path d="M306 270 L306 286" fill="none" stroke="#b3becc" stroke-width="1"/><rect x="366" y="224" width="72" height="46" rx="12" fill="#d9e4f5" stroke="none"/><text x="402" y="252" font-size="14" fill="#24334a" font-weight="500" text-anchor="middle">K/V 4</text><path d="M402 270 L402 286" fill="none" stroke="#4967b0" stroke-width="1"/><rect x="78" y="286" width="72" height="32" rx="6" fill="#eef1f6" stroke="none"/><text x="114" y="308" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">0.1</text><rect x="174" y="286" width="72" height="32" rx="6" fill="#eef1f6" stroke="none"/><text x="210" y="308" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">0.2</text><rect x="270" y="286" width="72" height="32" rx="6" fill="#eef1f6" stroke="none"/><text x="306" y="308" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">0.3</text><rect x="366" y="286" width="72" height="32" rx="6" fill="#cfe0f7" stroke="none"/><text x="402" y="308" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">0.4</text><text x="232" y="342" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">↑ 一行权重，其余位置只出现在分子分母里</text><path d="M241 352 L241 366" fill="none" stroke="#4967b0" stroke-width="2" marker-end="url(#arrow)"/><rect x="78" y="366" width="326" height="42" rx="8" fill="#d9e4f5" stroke="none"/><text x="241" y="393" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">输出 o₄　[1, 64]</text><text x="64" y="436" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">读取了 4 个位置，写出的仍然只有一行。</text><text x="64" y="458" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">位置下标不出现在输出形状里。</text><rect x="520" y="146" width="440" height="322" rx="12" fill="#eef4f0" stroke="none"/><text x="544" y="182" font-size="20" fill="#218575" font-weight="600" text-anchor="start">FFN：纵向过权重</text><text x="544" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">逐位置独立，只有宽度会变</text><rect x="544" y="238" width="115" height="46" rx="8" fill="#d9e4f5" stroke="none"/><text x="601.5" y="267" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">[1, 512]</text><rect x="544" y="304" width="269" height="46" rx="8" fill="#cfe8dd" stroke="none"/><text x="678.5" y="333" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">[1, 2048]</text><text x="827" y="333" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">W₁ 升维</text><rect x="544" y="370" width="115" height="46" rx="8" fill="#d9e4f5" stroke="none"/><text x="601.5" y="399" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">[1, 512]</text><text x="673" y="399" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">W₂ 降维</text><text x="544" y="436" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">中间层是这一行的特征被撑开，</text><text x="544" y="458" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">不是折成了更多 token。</text><text x="40" y="492" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">两个子层都只写回当前这一行。Attention 的&quot;多&quot;体现在它读取的位置数，FFN 的&quot;多&quot;体现在中间层宽度。</text><text x="40" y="520" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">这也解释了为什么只有 Attention 需要 KV Cache：它要读的那些位置，本步不在场。</text></g></svg>