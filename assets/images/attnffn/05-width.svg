<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">没有激活函数的宽度是假的</title><desc id="desc">两矩阵相乘可以合成一个，中间维度 m 只在有非线性时才兑现成表达力。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTN-FFN / 05</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">没有激活函数的宽度是假的</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">两矩阵相乘可以合成一个，中间维度 m 只在有非线性时才兑现成表达力。</text><rect x="40" y="146" width="440" height="322" rx="12" fill="#fbf3e6" stroke="none"/><text x="64" y="182" font-size="19" fill="#c88735" font-weight="600" text-anchor="start">无激活：(u·W₁)·W₂ = u·(W₁W₂)</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">右边是一个 512 × 512 的单矩阵</text><rect x="64" y="236" width="96" height="62" rx="8" fill="#f0d9c0" stroke="none"/><text x="112" y="274" font-size="19" fill="#c88735" font-weight="600" text-anchor="middle">W₁</text><text x="112" y="320" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">512×2048</text><rect x="180" y="236" width="96" height="62" rx="8" fill="#f0d9c0" stroke="none"/><text x="228" y="274" font-size="19" fill="#c88735" font-weight="600" text-anchor="middle">W₂</text><text x="228" y="320" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">2048×512</text><text x="300" y="274" font-size="22" fill="#c88735" font-weight="600" text-anchor="middle">=</text><rect x="340" y="236" width="116" height="62" rx="8" fill="#e0b98c" stroke="none"/><text x="398" y="274" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">单个 512×512</text><text x="64" y="372" font-size="17" fill="#c88735" font-weight="600" text-anchor="start">2,097,152 个参数</text><text x="64" y="400" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">等价于 262,144 个</text><text x="64" y="432" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">其中 1,835,008 个白占 —— 冗余八倍</text><rect x="520" y="146" width="440" height="322" rx="12" fill="#edf7f2" stroke="none"/><text x="544" y="182" font-size="19" fill="#218575" font-weight="600" text-anchor="start">有激活：m 维真的被用上</text><text x="544" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">逐元素非线性，不引入任何跨位置依赖</text><rect x="544" y="236" width="140" height="48" rx="8" fill="#a9d4c0" stroke="none"/><text x="614" y="257" font-size="16" fill="#218575" font-weight="600" text-anchor="middle">W₁</text><text x="614" y="276" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">512×2048</text><path d="M614 284 L614 298" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="298" width="140" height="48" rx="8" fill="#f6faf8" stroke="none"/><text x="614" y="319" font-size="16" fill="#218575" font-weight="600" text-anchor="middle">SiLU</text><text x="614" y="338" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">逐元素</text><path d="M614 346 L614 360" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="360" width="140" height="48" rx="8" fill="#a9d4c0" stroke="none"/><text x="614" y="381" font-size="16" fill="#218575" font-weight="600" text-anchor="middle">W₂</text><text x="614" y="400" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">2048×512</text><text x="712" y="260" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">中间维度 m 只有在</text><text x="712" y="284" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">这一层之后才不是摆设</text><text x="712" y="320" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">m ≈ 8d/3 是从</text><text x="712" y="344" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">3dm = 8d² 反解出来的</text><text x="40" y="508" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">宽度不是容量，宽度只是容器的口径。2/3 这个参数占比，说的正是这个容器有多大。</text><text x="40" y="536" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">也正因为激活是逐位置的，FFN 才敢把宽度开到四倍——它不需要向任何其他位置请示。</text></g></svg>