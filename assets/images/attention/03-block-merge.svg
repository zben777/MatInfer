<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">三块合并：ℓ 和 U 怎么走</title><desc id="desc">分数 [ln 2, ln 4, ln 8, ln 4, ln 2]、Value [1, 3, 5, 7, 9]，按 2 + 2 + 1 分块，最终应为 O = 5。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="610" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 03</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">三块合并：ℓ 和 U 怎么走</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">分数 [ln 2, ln 4, ln 8, ln 4, ln 2]、Value [1, 3, 5, 7, 9]，按 2 + 2 + 1 分块，最终应为 O = 5。</text><rect x="40" y="150" width="250" height="192" rx="10" fill="#f1f4fb" stroke="none"/><text x="60" y="182" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">块 1</text><text x="60" y="210" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">[ln 2, ln 4]</text><text x="60" y="248" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">m = ln 4</text><text x="60" y="280" font-size="18" fill="#4967b0" font-weight="500" text-anchor="start">ℓ = 1.5</text><text x="60" y="310" font-size="18" fill="#218575" font-weight="500" text-anchor="start">U = 3.5</text><rect x="375" y="150" width="250" height="192" rx="10" fill="#f1f4fb" stroke="none"/><text x="395" y="182" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">块 2</text><text x="395" y="210" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">[ln 8, ln 4]</text><text x="395" y="248" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">m = ln 8（更高）</text><text x="395" y="280" font-size="18" fill="#4967b0" font-weight="500" text-anchor="start">ℓ = 1.5</text><text x="395" y="310" font-size="18" fill="#218575" font-weight="500" text-anchor="start">U = 8.5</text><rect x="710" y="150" width="250" height="192" rx="10" fill="#f1f4fb" stroke="none"/><text x="730" y="182" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">块 3</text><text x="730" y="210" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">[ln 2]</text><text x="730" y="248" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">m = ln 2（更低）</text><text x="730" y="280" font-size="18" fill="#4967b0" font-weight="500" text-anchor="start">ℓ = 1</text><text x="730" y="310" font-size="18" fill="#218575" font-weight="500" text-anchor="start">U = 9</text><path d="M292 246 L371 246" fill="none" stroke="#c88735" stroke-width="2" marker-end="url(#arrow)"/><text x="331" y="226" font-size="17" fill="#c88735" font-weight="600" text-anchor="middle">α = ½</text><text x="331" y="274" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">缩旧状态</text><path d="M627 246 L706 246" fill="none" stroke="#c88735" stroke-width="2" marker-end="url(#arrow)"/><text x="666" y="226" font-size="17" fill="#c88735" font-weight="600" text-anchor="middle">β = ¼</text><text x="666" y="274" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">缩新块</text><text x="40" y="372" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">合并前两块后可以自查一次：O = 10.25 / 2.25 = 41 / 9 ≈ 4.556</text><rect x="40" y="390" width="920" height="78" rx="10" fill="#eef7f2" stroke="none"/><text x="500" y="438" font-size="24" fill="#24334a" font-weight="600" text-anchor="middle">m = ln 8　·　ℓ = 2.5　·　U = 12.5　→　O = 12.5 / 2.5 = 5</text><rect x="40" y="494" width="920" height="76" rx="10" fill="#fbf3e6" stroke="none"/><text x="64" y="524" font-size="18" fill="#c88735" font-weight="600" text-anchor="start">漏掉 β 会怎样</text><text x="64" y="552" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">直接把 ℓ₃ = 1 加到 2.25 上 → ℓ = 3.25 → 结果错；而且不报错、形状完全正确，只能靠数值对比发现。</text></g></svg>