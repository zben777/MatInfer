<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">这类算法有同一个形状：基准 + 累积量 + 修正项</title><desc id="desc">修正项是否存在、有多大，只由两个基准之差决定；差值归零，修正项随之消失。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="620" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 05</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">这类算法有同一个形状：基准 + 累积量 + 修正项</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">修正项是否存在、有多大，只由两个基准之差决定；差值归零，修正项随之消失。</text><rect x="40" y="140" width="450" height="350" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="178" font-size="21" fill="#4967b0" font-weight="600" text-anchor="start">Softmax 的归一化</text><text x="64" y="204" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">online normalizer / FlashAttention</text><text x="64" y="250" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">缺的全局量</text><text x="180" y="250" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">整行最大值</text><text x="64" y="298" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">状态</text><text x="180" y="298" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">(m, ℓ)</text><text x="64" y="346" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">合并</text><text x="180" y="346" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">ℓ ← exp(m₁ − m)·ℓ₁ + exp(m₂ − m)·ℓ₂</text><text x="64" y="394" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">修正项</text><text x="180" y="394" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">exp(m₁ − m)</text><text x="64" y="442" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">何时消失</text><text x="180" y="442" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">两个基准相同（实际几乎不会）</text><rect x="510" y="140" width="450" height="350" rx="12" fill="#edf7f2" stroke="none"/><text x="534" y="178" font-size="21" fill="#218575" font-weight="600" text-anchor="start">在线计算方差（Welford）</text><text x="534" y="204" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">论文自承的灵感来源</text><text x="534" y="250" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">缺的全局量</text><text x="650" y="250" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">整组数据的均值</text><text x="534" y="298" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">状态</text><text x="650" y="298" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">(n, x̄, M₂)</text><text x="534" y="346" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">合并</text><text x="650" y="346" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">M₂ ← M₂ₐ + M₂ᵦ + (nₐnᵦ/n)·δ²</text><text x="534" y="394" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">修正项</text><text x="650" y="394" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">(nₐnᵦ/n)·δ²，δ = x̄ᵦ − x̄ₐ</text><text x="534" y="442" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">何时消失</text><text x="650" y="442" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">δ = 0，两组均值相同</text><rect x="40" y="512" width="920" height="78" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="544" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">两个算法的修正项，都由两个基准之差唯一决定</text><text x="64" y="572" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">实测：两组数均值相差 9.5 时，修正项占最终 M₂ 的 95.7%——差得越远，越不能省掉这一步。</text></g></svg>