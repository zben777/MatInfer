<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">为什么要少读一遍：Safe Softmax 要读三次</title><desc id="desc">同一行分数被完整读取三遍，才能给出答案；online normalizer 把三遍压成一遍。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="560" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">为什么要少读一遍：Safe Softmax 要读三次</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">同一行分数被完整读取三遍，才能给出答案；online normalizer 把三遍压成一遍。</text><rect x="40" y="150" width="440" height="340" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="188" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">Safe Softmax（框架默认）</text><text x="64" y="214" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">三遍都建立在&quot;先知道全局 maxima&quot;之上</text><rect x="64" y="232" width="392" height="54" rx="8" fill="#eef1f6" stroke="none"/><text x="82" y="265" font-size="18" fill="#24334a" font-weight="400" text-anchor="start">第 1 遍　读 S → 求最大值 m</text><text x="438" y="265" font-size="16" fill="#4967b0" font-weight="500" text-anchor="end">1 读</text><rect x="64" y="294" width="392" height="54" rx="8" fill="#eef1f6" stroke="none"/><text x="82" y="327" font-size="18" fill="#24334a" font-weight="400" text-anchor="start">第 2 遍　读 S → 求指数和 ℓ</text><text x="438" y="327" font-size="16" fill="#4967b0" font-weight="500" text-anchor="end">1 读</text><rect x="64" y="356" width="392" height="54" rx="8" fill="#eef1f6" stroke="none"/><text x="82" y="389" font-size="18" fill="#24334a" font-weight="400" text-anchor="start">第 3 遍　读 S → 写出权重 P</text><text x="438" y="389" font-size="16" fill="#4967b0" font-weight="500" text-anchor="end">1 读 + 1 写</text><rect x="64" y="424" width="392" height="46" rx="8" fill="#f1f4fb" stroke="none"/><text x="82" y="453" font-size="18" fill="#4967b0" font-weight="600" text-anchor="start">每元素 4 次访存（3 读 + 1 写）</text><rect x="520" y="150" width="440" height="340" rx="12" fill="#f7f9fc" stroke="none"/><text x="544" y="188" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">Online Normalizer（NVIDIA, 2018）</text><text x="544" y="214" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">一趟读完，边走边修正</text><rect x="544" y="232" width="392" height="178" rx="8" fill="#edf7f2" stroke="none"/><text x="564" y="270" font-size="18" fill="#218575" font-weight="600" text-anchor="start">读一块 S，立即更新两个状态</text><text x="564" y="306" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">m ← max(m, 块内最大值)</text><text x="564" y="336" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">ℓ ← exp(m旧 − m新) · ℓ + Σ exp(s − m新)</text><text x="564" y="372" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">块内数据用完即弃，不回读</text><text x="564" y="398" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">原始分数不必保存</text><rect x="544" y="424" width="392" height="46" rx="8" fill="#f1f4fb" stroke="none"/><text x="562" y="453" font-size="18" fill="#218575" font-weight="600" text-anchor="start">每元素 3 次访存（2 读 + 1 写）</text><text x="40" y="530" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">论文在 V100 上实测：Softmax 最多 1.3×，与 TopK 融合最多 5×。省下的只是访存，不是计算。</text></g></svg>