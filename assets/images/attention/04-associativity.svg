<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">结合律：从&quot;只能顺序推进&quot;到&quot;可以分组并行&quot;</title><desc id="desc">合并运算满足 (a ⊕ b) ⊕ c = a ⊕ (b ⊕ c)，所以四块可以两两先算，最后规约一次。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="650" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">结合律：从&quot;只能顺序推进&quot;到&quot;可以分组并行&quot;</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">合并运算满足 (a ⊕ b) ⊕ c = a ⊕ (b ⊕ c)，所以四块可以两两先算，最后规约一次。</text><rect x="40" y="140" width="920" height="170" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="176" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">顺序合并</text><text x="64" y="202" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">一次只推进一块，后面必须等前面</text><rect x="64" y="226" width="160" height="50" rx="8" fill="#eef1f6" stroke="none"/><text x="144" y="257" font-size="18" fill="#24334a" font-weight="500" text-anchor="middle">块 1</text><path d="M228 251 L282 251" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="286" y="226" width="160" height="50" rx="8" fill="#eef1f6" stroke="none"/><text x="366" y="257" font-size="18" fill="#24334a" font-weight="500" text-anchor="middle">块 2</text><path d="M450 251 L504 251" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="508" y="226" width="160" height="50" rx="8" fill="#eef1f6" stroke="none"/><text x="588" y="257" font-size="18" fill="#24334a" font-weight="500" text-anchor="middle">块 3</text><path d="M672 251 L726 251" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="226" width="160" height="50" rx="8" fill="#eef1f6" stroke="none"/><text x="810" y="257" font-size="18" fill="#24334a" font-weight="500" text-anchor="middle">块 4</text><rect x="40" y="336" width="920" height="268" rx="12" fill="#edf7f2" stroke="none"/><text x="64" y="372" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">结合律允许的走法</text><text x="64" y="398" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">两组的中间状态互不依赖，谁先算完都不影响结果</text><rect x="140" y="418" width="160" height="46" rx="8" fill="#dceee6" stroke="none"/><text x="220" y="447" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">块 1</text><rect x="340" y="418" width="160" height="46" rx="8" fill="#dceee6" stroke="none"/><text x="420" y="447" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">块 2</text><rect x="540" y="418" width="160" height="46" rx="8" fill="#dceee6" stroke="none"/><text x="620" y="447" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">块 3</text><rect x="740" y="418" width="160" height="46" rx="8" fill="#dceee6" stroke="none"/><text x="820" y="447" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">块 4</text><rect x="110" y="496" width="220" height="46" rx="8" fill="#cfe8dd" stroke="none"/><text x="220" y="525" font-size="17" fill="#218575" font-weight="600" text-anchor="middle">状态 A = 1 ⊕ 2</text><rect x="710" y="496" width="220" height="46" rx="8" fill="#cfe8dd" stroke="none"/><text x="820" y="525" font-size="17" fill="#218575" font-weight="600" text-anchor="middle">状态 B = 3 ⊕ 4</text><rect x="290" y="562" width="420" height="46" rx="8" fill="#b9dccb" stroke="none"/><text x="500" y="591" font-size="18" fill="#24334a" font-weight="600" text-anchor="middle">A ⊕ B → (m, ℓ, U) → O</text><path d="M220 466 L220 494" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 466 L250 494" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 466 L820 494" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 466 L790 494" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M230 544 L450 560" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 544 L550 560" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="634" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">规约一次只需要 1 次 max 和 2 次乘加——切分几乎不需要犹豫，分块策略的自由度就是这么来的。</text></g></svg>