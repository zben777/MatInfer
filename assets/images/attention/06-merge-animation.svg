<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">合并过程（动画）：每一步都在为&quot;基准差&quot;买单</title><desc id="desc">五步循环播放：建立基准 → 抬基准缩旧状态 → 并入 → 缩新块 → 得到 O = 5。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><style>@keyframes sw{0%,19.9%{opacity:1}20%,100%{opacity:0}}.f{animation:sw 10s linear infinite;opacity:0}.f1{animation-delay:0s}.f2{animation-delay:2s}.f3{animation-delay:4s}.f4{animation-delay:6s}.f5{animation-delay:8s}@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:0}.f5{opacity:1}}</style><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="390" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 06</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">合并过程（动画）：每一步都在为&quot;基准差&quot;买单</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">五步循环播放：建立基准 → 抬基准缩旧状态 → 并入 → 缩新块 → 得到 O = 5。</text><g class="f f1"><rect x="40" y="150" width="920" height="200" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="190" font-size="24" fill="#4967b0" font-weight="600" text-anchor="start">① 读入块 1</text><text x="64" y="226" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">m = ln 4　ℓ = 1.5　U = 3.5</text><text x="64" y="258" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">块内最大值成为初始基准</text><text x="600" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">ℓ</text><rect x="600" y="232" width="110" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="655" y="222" font-size="17" fill="#4967b0" font-weight="500" text-anchor="middle">1.5</text><text x="770" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">U</text><rect x="770" y="232" width="110" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="825" y="222" font-size="17" fill="#4967b0" font-weight="500" text-anchor="middle">3.5</text></g><g class="f f2"><rect x="40" y="150" width="920" height="200" rx="12" fill="#fbf3e6" stroke="none"/><text x="64" y="190" font-size="24" fill="#c88735" font-weight="600" text-anchor="start">② 遇到块 2，它更大</text><text x="64" y="226" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">m 从 ln 4 抬到 ln 8</text><text x="64" y="258" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">旧状态必须整体乘 α = ½，否则基准不一致</text><text x="600" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">ℓ</text><rect x="600" y="277" width="110" height="45" rx="4" fill="#c88735" stroke="none"/><text x="655" y="267" font-size="17" fill="#c88735" font-weight="500" text-anchor="middle">0.75</text><text x="770" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">U</text><rect x="770" y="277" width="110" height="45" rx="4" fill="#c88735" stroke="none"/><text x="825" y="267" font-size="17" fill="#c88735" font-weight="500" text-anchor="middle">1.75</text></g><g class="f f3"><rect x="40" y="150" width="920" height="200" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="190" font-size="24" fill="#4967b0" font-weight="600" text-anchor="start">③ 并入块 2</text><text x="64" y="226" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">ℓ = 0.75 + 1.5 = 2.25　U = 1.75 + 8.5 = 10.25</text><text x="64" y="258" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">此时 O = 41 / 9 ≈ 4.556</text><text x="600" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">ℓ</text><rect x="600" y="232" width="110" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="655" y="222" font-size="17" fill="#4967b0" font-weight="500" text-anchor="middle">2.25</text><text x="770" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">U</text><rect x="770" y="232" width="110" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="825" y="222" font-size="17" fill="#4967b0" font-weight="500" text-anchor="middle">10.25</text></g><g class="f f4"><rect x="40" y="150" width="920" height="200" rx="12" fill="#fbf3e6" stroke="none"/><text x="64" y="190" font-size="24" fill="#c88735" font-weight="600" text-anchor="start">④ 遇到块 3，它更小</text><text x="64" y="226" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">m 保持 ln 8</text><text x="64" y="258" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">这次要缩的是新块，β = ¼；漏掉这一步不会报错</text><text x="600" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">ℓ</text><rect x="600" y="232" width="110" height="90" rx="4" fill="#c88735" stroke="none"/><text x="655" y="222" font-size="17" fill="#c88735" font-weight="500" text-anchor="middle">2.25</text><text x="770" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">U</text><rect x="770" y="232" width="110" height="90" rx="4" fill="#c88735" stroke="none"/><text x="825" y="222" font-size="17" fill="#c88735" font-weight="500" text-anchor="middle">10.25</text></g><g class="f f5"><rect x="40" y="150" width="920" height="200" rx="12" fill="#eef7f2" stroke="none"/><text x="64" y="190" font-size="24" fill="#218575" font-weight="600" text-anchor="start">⑤ 合并完成</text><text x="64" y="226" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">ℓ = 2.5　U = 12.5　O = 5</text><text x="64" y="258" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">与一次性计算完全一致</text><text x="600" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">ℓ</text><rect x="600" y="232" width="110" height="90" rx="4" fill="#218575" stroke="none"/><text x="655" y="222" font-size="17" fill="#218575" font-weight="500" text-anchor="middle">2.5</text><text x="770" y="306" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">U</text><rect x="770" y="232" width="110" height="90" rx="4" fill="#218575" stroke="none"/><text x="825" y="222" font-size="17" fill="#218575" font-weight="500" text-anchor="middle">12.5</text></g></g></svg>