<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">换基准只是整体乘一个常数</title><desc id="desc">块 1 = [ln 2, ln 4]。基准从 ln 4 抬到 ln 8，每个指数项乘同一个系数，比值不变。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="560" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / ATTENTION / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">换基准只是整体乘一个常数</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">块 1 = [ln 2, ln 4]。基准从 ln 4 抬到 ln 8，每个指数项乘同一个系数，比值不变。</text><rect x="40" y="140" width="390" height="380" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="174" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">以 m = ln 4 为基准</text><text x="64" y="200" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">块 1 的两个指数项</text><path d="M64 400 L406 400" fill="none" stroke="#d8e0e9" stroke-width="2"/><rect x="72" y="355" width="80" height="45" rx="4" fill="#4967b0" stroke="none"/><text x="112" y="341" font-size="18" fill="#4967b0" font-weight="500" text-anchor="middle">½</text><rect x="192" y="310" width="80" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="232" y="296" font-size="18" fill="#4967b0" font-weight="500" text-anchor="middle">1</text><text x="112" y="426" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">ln 2</text><text x="232" y="426" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">ln 4</text><text x="64" y="462" font-size="19" fill="#4967b0" font-weight="600" text-anchor="start">ℓ = ½ + 1 = 1.5</text><text x="64" y="492" font-size="19" fill="#218575" font-weight="600" text-anchor="start">U = ½·1 + 1·3 = 3.5</text><rect x="570" y="140" width="390" height="380" rx="12" fill="#f7f9fc" stroke="none"/><text x="594" y="174" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">以 m = ln 8 为基准</text><text x="594" y="200" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">同一块数据，没变</text><path d="M594 400 L936 400" fill="none" stroke="#d8e0e9" stroke-width="2"/><rect x="602" y="377.5" width="80" height="22.5" rx="4" fill="#4967b0" stroke="none"/><text x="642" y="365" font-size="18" fill="#4967b0" font-weight="500" text-anchor="middle">¼</text><rect x="722" y="355" width="80" height="45" rx="4" fill="#4967b0" stroke="none"/><text x="762" y="343" font-size="18" fill="#4967b0" font-weight="500" text-anchor="middle">½</text><text x="642" y="426" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">ln 2</text><text x="762" y="426" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">ln 4</text><text x="594" y="462" font-size="19" fill="#4967b0" font-weight="600" text-anchor="start">ℓ = ¼ + ½ = 0.75</text><text x="594" y="492" font-size="19" fill="#218575" font-weight="600" text-anchor="start">0.75 = 1.5 × ½</text><path d="M447 380 L563 380" fill="none" stroke="#4967b0" stroke-width="2" marker-end="url(#arrow)"/><text x="505" y="352" font-size="24" fill="#4967b0" font-weight="600" text-anchor="middle">× ½</text><text x="505" y="414" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">= e^(ln4 − ln8)</text><text x="40" y="545" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">比值不变（½ : 1 = ¼ : ½），所以 ℓ 与 U 乘同一个系数就能整体搬到新基准；原始分数不必保留。</text></g></svg>