<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">RMSNorm：从一行数据到算子执行</title><desc id="desc">数学结构是 reduction + rsqrt + elementwise；物理读写次数由实现决定。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="555" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / NORMALIZATION / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">RMSNorm：从一行数据到算子执行</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">数学结构是 reduction + rsqrt + elementwise；物理读写次数由实现决定。</text><rect x="40" y="173" width="200" height="110" rx="12" fill="#f4f7fb" stroke="none"/><text x="140" y="214" font-size="21" fill="#6d7c90" font-weight="600" text-anchor="middle">读取 x</text><text x="140" y="252" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="middle">一行 D 个元素</text><path d="M245 226 L275 226" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="173" width="200" height="110" rx="12" fill="#f4f7fb" stroke="none"/><text x="380" y="214" font-size="21" fill="#4967b0" font-weight="600" text-anchor="middle">归约平方和</text><text x="380" y="252" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="middle">mean(x²)</text><path d="M485 226 L515 226" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="173" width="200" height="110" rx="12" fill="#f4f7fb" stroke="none"/><text x="620" y="214" font-size="21" fill="#c88735" font-weight="600" text-anchor="middle">计算系数</text><text x="620" y="252" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="middle">rsqrt(q + ε)</text><path d="M725 226 L755 226" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="173" width="200" height="110" rx="12" fill="#f4f7fb" stroke="none"/><text x="860" y="214" font-size="21" fill="#218575" font-weight="600" text-anchor="middle">逐元素输出</text><text x="860" y="252" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="middle">x · r · γ</text><rect x="40" y="325" width="440" height="140" rx="12" fill="#f1f4fb" stroke="none"/><text x="62" y="359" font-size="20" fill="#4967b0" font-weight="600" text-anchor="start">数值精度</text><text x="62" y="398" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">低精度输入：可用 FP32 累积平方和</text><text x="62" y="435" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">平方在提升精度之后进行，避免先溢出</text><rect x="510" y="325" width="450" height="140" rx="12" fill="#edf7f2" stroke="none"/><text x="532" y="359" font-size="20" fill="#218575" font-weight="600" text-anchor="start">融合与访存</text><text x="532" y="398" font-size="17" fill="#24334a" font-weight="400" text-anchor="start">融合可减少中间张量与 kernel 启动</text><text x="532" y="435" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">是否受带宽限制，仍取决于形状和实现</text><text x="40" y="516" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">图示表达数据依赖，不表示必须启动四个 kernel，也不代表实测性能。</text></g></svg>