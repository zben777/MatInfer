<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">归一化的范围：一个 token 的隐藏向量</title><desc id="desc">典型 Transformer：输入 [B, S, D]，统计量沿最后一个维度 D 计算。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="570" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / NORMALIZATION / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">归一化的范围：一个 token 的隐藏向量</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">典型 Transformer：输入 [B, S, D]，统计量沿最后一个维度 D 计算。</text><text x="40" y="170" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">B：请求 / 批次</text><text x="40" y="201" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">S：token 位置</text><text x="260" y="160" font-size="17" fill="#218575" font-weight="600" text-anchor="start">D：隐藏维度 →</text><text x="60" y="241" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">token 1</text><rect x="170" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="207" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="244" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="281" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="318" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="355" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="392" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="429" y="215" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><text x="60" y="287" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">token 2</text><rect x="170" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="207" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="244" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="281" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="318" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="355" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="392" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><rect x="429" y="261" width="31" height="34" rx="5" fill="#e0f1eb" stroke="#218575"/><text x="60" y="333" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">token 3</text><rect x="170" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="207" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="244" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="281" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="318" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="355" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="392" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="429" y="307" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><text x="60" y="379" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">token 4</text><rect x="170" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="207" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="244" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="281" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="318" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="355" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="392" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><rect x="429" y="353" width="31" height="34" rx="5" fill="#eef1f6" stroke="none"/><text x="170" y="431" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">每一行独立统计；不跨 token 或 batch 求均值。</text><path d="M475 278 L555 278" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="181" width="370" height="215" rx="12" fill="#f5f8fb" stroke="none"/><text x="604" y="215" font-size="21" fill="#24334a" font-weight="600" text-anchor="start">一行：x = [x₁, …, xD]</text><text x="604" y="260" font-size="18" fill="#24334a" font-weight="400" text-anchor="start">归约得到一个标量统计量</text><text x="604" y="301" font-size="18" fill="#24334a" font-weight="400" text-anchor="start">用它缩放这一行的每个元素</text><text x="604" y="348" font-size="17" fill="#218575" font-weight="400" text-anchor="start">γ（以及 LN 的 β）：D 个参数</text><rect x="40" y="473" width="910" height="61" rx="12" fill="#f7f9fc" stroke="none"/><text x="60" y="498" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">Pre-Norm 子层</text><text x="260" y="511" font-size="20" fill="#24334a" font-weight="400" text-anchor="start">x → Norm → Attention / FFN → 与 x 相加</text><text x="40" y="559" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">Norm 约束的是子层输入；残差相加后的 hidden state 不保证具有固定尺度。</text></g></svg>