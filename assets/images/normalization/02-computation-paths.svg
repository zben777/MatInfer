<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">两条计算路径：中心化与尺度缩放</title><desc id="desc">LayerNorm 减去均值后除以标准差；RMSNorm 直接除以均方根。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="640" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / NORMALIZATION / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">两条计算路径：中心化与尺度缩放</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">LayerNorm 减去均值后除以标准差；RMSNorm 直接除以均方根。</text><rect x="350" y="151" width="300" height="52" rx="12" fill="#f0f3f8" stroke="none"/><text x="500" y="184" font-size="21" fill="#24334a" font-weight="600" text-anchor="middle">同一个输入向量 x</text><text x="40" y="245" font-size="24" fill="#4967b0" font-weight="600" text-anchor="start">LayerNorm</text><rect x="40" y="266" width="430" height="77" rx="12" fill="#f1f4fb" stroke="none"/><text x="60" y="297" font-size="19" fill="#4967b0" font-weight="500" text-anchor="start">均值 μ = mean(x)</text><text x="60" y="325" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">中心化 c = x − μ</text><path d="M255 344 L255 360" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="364" width="430" height="77" rx="12" fill="#f1f4fb" stroke="none"/><text x="60" y="395" font-size="19" fill="#4967b0" font-weight="500" text-anchor="start">方差 v = mean(c²)</text><text x="60" y="423" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">r = 1 / √(v + ε)</text><path d="M255 442 L255 458" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="462" width="430" height="77" rx="12" fill="#f1f4fb" stroke="none"/><text x="60" y="493" font-size="19" fill="#4967b0" font-weight="500" text-anchor="start">输出 y = γ ⊙ c · r + β</text><text x="60" y="521" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">中心 + 尺度，再学习缩放与平移</text><text x="530" y="245" font-size="24" fill="#218575" font-weight="600" text-anchor="start">RMSNorm</text><rect x="530" y="266" width="430" height="77" rx="12" fill="#edf7f2" stroke="none"/><text x="550" y="297" font-size="19" fill="#218575" font-weight="500" text-anchor="start">平方均值 q = mean(x²)</text><text x="550" y="325" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">不减去均值</text><path d="M745 344 L745 360" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="364" width="430" height="77" rx="12" fill="#edf7f2" stroke="none"/><text x="550" y="395" font-size="19" fill="#218575" font-weight="500" text-anchor="start">r = 1 / √(q + ε)</text><text x="550" y="423" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">直接计算缩放系数</text><path d="M745 442 L745 458" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="462" width="430" height="77" rx="12" fill="#edf7f2" stroke="none"/><text x="550" y="493" font-size="19" fill="#218575" font-weight="500" text-anchor="start">输出 y = γ ⊙ x · r</text><text x="550" y="521" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">尺度归一化，再学习缩放</text><path d="M500 203 L255 222" fill="none" stroke="#b3becc" stroke-width="2"/><path d="M500 203 L745 222" fill="none" stroke="#b3becc" stroke-width="2"/><text x="40" y="613" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">标准 RMSNorm 无 β；γ 是逐特征参数，不是整行共享的一个标量。</text></g></svg>