<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title"><title id="title">FFN：从两层变换到门控变换</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#aab8c9"/></marker></defs><rect width="1000" height="610" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="38" font-size="13" fill="#218575" text-anchor="start">MATINFER / TRANSFORMER</text><text x="40" y="80" font-size="28" fill="#24334a" text-anchor="start">FFN：从两层变换到门控变换</text><text x="40" y="116" font-size="17" fill="#6d7c90" text-anchor="start">所有矩阵作用于最后一个特征维度，token 位置维度保持不变。</text><text x="40" y="165" font-size="21" fill="#4967b0" text-anchor="start">基础 FFN</text><rect x="40" y="195" width="130" height="58" rx="10" fill="#eef4fb"/><text x="105.0" y="230.0" font-size="19" fill="#24334a" text-anchor="middle">输入 [S, d]</text><rect x="225" y="195" width="145" height="58" rx="10" fill="#eef4fb"/><text x="297.5" y="230.0" font-size="19" fill="#24334a" text-anchor="middle">W₁: d → m</text><rect x="430" y="195" width="115" height="58" rx="10" fill="#eef4fb"/><text x="487.5" y="230.0" font-size="19" fill="#24334a" text-anchor="middle">激活函数</text><rect x="605" y="195" width="145" height="58" rx="10" fill="#eef4fb"/><text x="677.5" y="230.0" font-size="19" fill="#24334a" text-anchor="middle">W₂: m → d</text><rect x="810" y="195" width="150" height="58" rx="10" fill="#eef4fb"/><text x="885.0" y="230.0" font-size="19" fill="#24334a" text-anchor="middle">输出 [S, d]</text><path d="M175 224 L220 224" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M375 224 L425 224" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M550 224 L600 224" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M755 224 L805 224" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><text x="40" y="308" font-size="21" fill="#218575" text-anchor="start">SwiGLU：一路产生门控，一路产生待调制特征</text><rect x="40" y="401" width="130" height="58" rx="10" fill="#eef4fb"/><text x="105.0" y="436.0" font-size="19" fill="#24334a" text-anchor="middle">输入 [S, d]</text><rect x="240" y="350" width="210" height="58" rx="10" fill="#edf7f2"/><text x="345.0" y="385.0" font-size="19" fill="#24334a" text-anchor="middle">Wg → SiLU</text><rect x="240" y="458" width="210" height="58" rx="10" fill="#edf7f2"/><text x="345.0" y="493.0" font-size="19" fill="#24334a" text-anchor="middle">Wu</text><rect x="540" y="401" width="80" height="58" rx="10" fill="#edf7f2"/><text x="580.0" y="436.0" font-size="19" fill="#24334a" text-anchor="middle">⊙</text><rect x="695" y="401" width="125" height="58" rx="10" fill="#edf7f2"/><text x="757.5" y="436.0" font-size="19" fill="#24334a" text-anchor="middle">Wd: m → d</text><rect x="870" y="401" width="90" height="58" rx="10" fill="#edf7f2"/><text x="915.0" y="436.0" font-size="19" fill="#24334a" text-anchor="middle">输出</text><path d="M175 430 L235 379" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M175 430 L235 487" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M455 379 L535 430" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M455 487 L535 430" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M625 430 L690 430" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M825 430 L865 430" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><text x="40" y="578" font-size="18" fill="#6d7c90" text-anchor="start">基础 FFN 有两次投影；SwiGLU 有三次投影。中间宽度 m 由模型配置决定。</text></g></svg>