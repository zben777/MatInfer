<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1420" role="img" aria-labelledby="title"><title id="title">FFN：当前一行的特征变换</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#aab8c9"/></marker></defs><rect width="680" height="1420" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="36" y="37" font-size="13" fill="#218575" text-anchor="start">MATINFER / DECODE</text><text x="36" y="79" font-size="26" fill="#24334a" text-anchor="start">FFN：当前一行的特征变换</text><text x="36" y="116" font-size="17" fill="#6d7c90" text-anchor="start">token 数量保持为 1，中间特征维度由 d 变为 m。</text><text x="36" y="167" font-size="22" fill="#4967b0" text-anchor="start">基础 FFN</text><rect x="130" y="195" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="230.0" font-size="20" fill="#24334a" text-anchor="middle">当前输入 [1, d]</text><path d="M340 258 L340 277" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="283" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="318.0" font-size="20" fill="#24334a" text-anchor="middle">W₁：d → m</text><path d="M340 346 L340 365" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="371" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="406.0" font-size="20" fill="#24334a" text-anchor="middle">激活函数 ReLU / GELU</text><path d="M340 434 L340 453" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="459" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="494.0" font-size="20" fill="#24334a" text-anchor="middle">W₂：m → d</text><path d="M340 522 L340 541" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="547" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="582.0" font-size="20" fill="#24334a" text-anchor="middle">输出 [1, d]</text><text x="36" y="664" font-size="22" fill="#218575" text-anchor="start">SwiGLU：两路特征，逐元素调制</text><rect x="130" y="695" width="420" height="58" rx="12" fill="#edf7f2"/><text x="340.0" y="730.0" font-size="20" fill="#24334a" text-anchor="middle">当前输入 [1, d]</text><path d="M260 758 L170 805" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M420 758 L510 805" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="811" width="260" height="66" rx="12" fill="#edf7f2"/><text x="170.0" y="850.0" font-size="20" fill="#24334a" text-anchor="middle">Wg → SiLU</text><rect x="380" y="811" width="260" height="66" rx="12" fill="#edf7f2"/><text x="510.0" y="850.0" font-size="20" fill="#24334a" text-anchor="middle">Wu</text><text x="170" y="908" font-size="17" fill="#6d7c90" text-anchor="middle">[1, m]</text><text x="510" y="908" font-size="17" fill="#6d7c90" text-anchor="middle">[1, m]</text><path d="M170 918 L280 964" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M510 918 L400 964" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="970" width="420" height="66" rx="12" fill="#edf7f2"/><text x="340.0" y="1009.0" font-size="20" fill="#24334a" text-anchor="middle">逐元素相乘 ⊙：[1, m]</text><path d="M340 1041 L340 1081" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="1087" width="420" height="58" rx="12" fill="#edf7f2"/><text x="340.0" y="1122.0" font-size="20" fill="#24334a" text-anchor="middle">Wd：m → d</text><path d="M340 1150 L340 1190" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="1196" width="420" height="58" rx="12" fill="#edf7f2"/><text x="340.0" y="1231.0" font-size="20" fill="#24334a" text-anchor="middle">输出 [1, d]</text><text x="36" y="1312" font-size="18" fill="#24334a" text-anchor="start">基础 FFN：两个主要权重矩阵；SwiGLU：三个。</text><text x="36" y="1350" font-size="17" fill="#6d7c90" text-anchor="start">门控发生在特征坐标上，不在 token 位置之间聚合。</text></g></svg>