<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1030" role="img" aria-labelledby="title"><title id="title">一次 decode：当前 token 怎样计算</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#aab8c9"/></marker></defs><rect width="680" height="1030" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="36" y="37" font-size="13" fill="#218575" text-anchor="start">MATINFER / DECODE</text><text x="36" y="79" font-size="26" fill="#24334a" text-anchor="start">一次 decode：当前 token 怎样计算</text><text x="36" y="116" font-size="17" fill="#6d7c90" text-anchor="start">单请求 · 位置 4 为当前输入 · 示例 d = 512</text><rect x="130" y="151" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="186.0" font-size="20" fill="#24334a" text-anchor="middle">当前 token 表示 [1, 512]</text><path d="M340 214 L340 251" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="257" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="292.0" font-size="20" fill="#24334a" text-anchor="middle">本层投影：Q₄、K₄、V₄</text><path d="M260 319 L160 357" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M420 319 L480 357" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="362" width="240" height="64" rx="12" fill="#eef4fb"/><text x="160.0" y="400.0" font-size="20" fill="#24334a" text-anchor="middle">当前 Q₄ [1, 64]</text><rect x="370" y="362" width="270" height="64" rx="12" fill="#eef4fb"/><text x="505.0" y="400.0" font-size="20" fill="#24334a" text-anchor="middle">历史 KV + 当前 K₄/V₄</text><text x="505" y="453" font-size="17" fill="#6d7c90" text-anchor="middle">单头 K/V：[4, 64]</text><path d="M160 431 L275 493" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M505 462 L405 493" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="499" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="534.0" font-size="20" fill="#24334a" text-anchor="middle">QK 点积 → Softmax：[1, 4]</text><path d="M340 562 L340 602" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="608" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="643.0" font-size="20" fill="#24334a" text-anchor="middle">加权 V：单头输出 [1, 64]</text><path d="M340 671 L340 711" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="717" width="420" height="58" rx="12" fill="#eef4fb"/><text x="340.0" y="752.0" font-size="20" fill="#24334a" text-anchor="middle">多头拼接 + Wₒ：[1, 512]</text><path d="M340 780 L340 820" stroke="#aab8c9" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="826" width="420" height="70" rx="12" fill="#edf7f2"/><text x="340.0" y="867.0" font-size="20" fill="#24334a" text-anchor="middle">FFN：当前行 [1, 512] → [1, 512]</text><text x="36" y="946" font-size="18" fill="#24334a" text-anchor="start">每层有自己的 KV Cache；历史 token 的 FFN 不重算。</text><text x="36" y="982" font-size="16" fill="#6d7c90" text-anchor="start">图中省略 Norm、残差与位置处理，箭头表示逻辑数据流。</text></g></svg>