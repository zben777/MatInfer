<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">Attention 与 FFN：混合不同的维度</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#aab8c9"/></marker></defs><rect width="1000" height="620" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="38" font-size="13" fill="#218575" text-anchor="start">MATINFER / TRANSFORMER</text><text x="40" y="80" font-size="28" fill="#24334a" text-anchor="start">Attention 与 FFN：混合不同的维度</text><text x="40" y="116" font-size="17" fill="#6d7c90" text-anchor="start">左侧：跨可见 token 聚合；右侧：每行独立变换特征，所有行共享同一套参数。</text><text x="40" y="165" font-size="21" fill="#4967b0" text-anchor="start">因果 Attention：位置 3 的一次聚合</text><text x="560" y="165" font-size="21" fill="#218575" text-anchor="start">FFN：对每个位置使用同一个 f</text><rect x="40" y="195" width="110" height="46" rx="10" fill="#eef4fb"/><text x="95.0" y="224.0" font-size="19" fill="#24334a" text-anchor="middle">token 1</text><rect x="560" y="195" width="110" height="46" rx="10" fill="#edf7f2"/><text x="615.0" y="224.0" font-size="19" fill="#24334a" text-anchor="middle">h1</text><rect x="730" y="195" width="80" height="46" rx="10" fill="#edf7f2"/><text x="770.0" y="224.0" font-size="19" fill="#24334a" text-anchor="middle">f</text><rect x="870" y="195" width="90" height="46" rx="10" fill="#edf7f2"/><text x="915.0" y="224.0" font-size="19" fill="#24334a" text-anchor="middle">y1</text><path d="M675 218 L725 218" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M815 218 L865 218" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M155 218 L330 374" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="273" width="110" height="46" rx="10" fill="#eef4fb"/><text x="95.0" y="302.0" font-size="19" fill="#24334a" text-anchor="middle">token 2</text><rect x="560" y="273" width="110" height="46" rx="10" fill="#edf7f2"/><text x="615.0" y="302.0" font-size="19" fill="#24334a" text-anchor="middle">h2</text><rect x="730" y="273" width="80" height="46" rx="10" fill="#edf7f2"/><text x="770.0" y="302.0" font-size="19" fill="#24334a" text-anchor="middle">f</text><rect x="870" y="273" width="90" height="46" rx="10" fill="#edf7f2"/><text x="915.0" y="302.0" font-size="19" fill="#24334a" text-anchor="middle">y2</text><path d="M675 296 L725 296" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M815 296 L865 296" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M155 296 L330 374" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="351" width="110" height="46" rx="10" fill="#eef4fb"/><text x="95.0" y="380.0" font-size="19" fill="#24334a" text-anchor="middle">token 3</text><rect x="560" y="351" width="110" height="46" rx="10" fill="#edf7f2"/><text x="615.0" y="380.0" font-size="19" fill="#24334a" text-anchor="middle">h3</text><rect x="730" y="351" width="80" height="46" rx="10" fill="#edf7f2"/><text x="770.0" y="380.0" font-size="19" fill="#24334a" text-anchor="middle">f</text><rect x="870" y="351" width="90" height="46" rx="10" fill="#edf7f2"/><text x="915.0" y="380.0" font-size="19" fill="#24334a" text-anchor="middle">y3</text><path d="M675 374 L725 374" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M815 374 L865 374" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M155 374 L330 374" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="429" width="110" height="46" rx="10" fill="#eef4fb"/><text x="95.0" y="458.0" font-size="19" fill="#24334a" text-anchor="middle">token 4</text><rect x="560" y="429" width="110" height="46" rx="10" fill="#edf7f2"/><text x="615.0" y="458.0" font-size="19" fill="#24334a" text-anchor="middle">h4</text><rect x="730" y="429" width="80" height="46" rx="10" fill="#edf7f2"/><text x="770.0" y="458.0" font-size="19" fill="#24334a" text-anchor="middle">f</text><rect x="870" y="429" width="90" height="46" rx="10" fill="#edf7f2"/><text x="915.0" y="458.0" font-size="19" fill="#24334a" text-anchor="middle">y4</text><path d="M675 452 L725 452" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><path d="M815 452 L865 452" stroke="#aab8c9" stroke-width="2" marker-end="url(#a)"/><rect x="335" y="351" width="135" height="46" rx="10" fill="#eef4fb"/><text x="402.5" y="380.0" font-size="19" fill="#24334a" text-anchor="middle">输出 h₃</text><text x="172" y="508" font-size="17" fill="#6d7c90" text-anchor="start">位置 4 对位置 3 不可见</text><text x="560" y="528" font-size="16" fill="#6d7c90" text-anchor="start">没有跨行箭头；f 内部会混合特征坐标。</text><text x="40" y="586" font-size="18" fill="#24334a" text-anchor="start">Attention 的输出已包含上下文；FFN 不直接混合 token，并不等于它的输入没有上下文。</text></g></svg>