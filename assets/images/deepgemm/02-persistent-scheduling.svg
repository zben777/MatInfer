<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" width="100%" role="img">
<title>persistent 调度：132 个 CTA 循环领取 2048 个输出块</title>
<desc>H100 上 grid 固定为 132 个 CTA，每个 CTA 按 iter 乘 132 加 blockIdx.x 的公式循环领取输出块，直到编号超过 2048。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="36" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#0C447C">输出块：ceil(4096/128) × ceil(8192/128) = 32 × 64 = 2048</text>
<text x="40" y="58" font-family="var(--font-mono)" font-size="12" fill="#185FA5">next_block_idx = (++iter) × kNumSMs + blockIdx.x</text>
<rect x="40" y="78" width="248" height="176" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="56" y="102" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#0C447C">逻辑输出网格（示意 4 × 4）</text>
<rect x="60" y="118" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="81" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">0</text>
<rect x="112" y="118" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="133" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">1</text>
<rect x="164" y="118" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="185" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">2</text>
<rect x="216" y="118" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="237" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="60" y="152" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="81" y="169" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">64</text>
<rect x="112" y="152" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="133" y="169" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">65</text>
<rect x="164" y="152" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="185" y="169" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="216" y="152" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="237" y="169" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="60" y="186" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="81" y="203" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="112" y="186" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="133" y="203" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="164" y="186" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="185" y="203" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">…</text>
<rect x="216" y="186" width="42" height="26" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/><text x="237" y="203" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#0C447C">2047</text>
<text x="60" y="236" font-family="var(--font-sans)" font-size="12" fill="#185FA5">swizzle 后按组映射为 (m_block, n_block)</text>
<path d="M296 166 L356 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="326" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#444441">领取</text>
<rect x="364" y="78" width="276" height="176" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="380" y="102" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#085041">grid = 132 个常驻 CTA</text>
<rect x="380" y="114" width="244" height="34" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="392" y="136" font-family="var(--font-mono)" font-size="12" fill="#04342C">CTA 0</text>
<text x="452" y="136" font-family="var(--font-mono)" font-size="12" fill="#04342C">0 → 132 → 264 → … → 1980</text>
<rect x="380" y="156" width="244" height="34" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="392" y="178" font-family="var(--font-mono)" font-size="12" fill="#04342C">CTA 1</text>
<text x="452" y="178" font-family="var(--font-mono)" font-size="12" fill="#04342C">1 → 133 → 265 → … → 1981</text>
<rect x="380" y="198" width="244" height="34" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="392" y="220" font-family="var(--font-mono)" font-size="12" fill="#04342C">CTA 131</text>
<text x="452" y="220" font-family="var(--font-mono)" font-size="12" fill="#04342C">131 → 263 → … → 1979</text>
<rect x="40" y="270" width="600" height="66" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="294" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A">2048 / 132 = 15 余 68</text>
<text x="56" y="316" font-family="var(--font-sans)" font-size="12" fill="#444441">前 68 个 CTA 各领 16 块，其余各领 15 块；末波利用率进入 L1/L2 周期模型的 wave_efficiency</text>
</svg>
