<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" role="img" aria-labelledby="title desc"><title id="title">C 被切成 16 块，交给 16 个 CTA</title><desc id="desc">256×512 的输出，按 64×128 切分；每个 CTA 拿一块。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="632" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">C 被切成 16 块，交给 16 个 CTA</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">256×512 的输出，按 64×128 切分；每个 CTA 拿一块。</text><text x="300" y="168" font-size="15" fill="#6d7c90" font-weight="600" text-anchor="middle">N = 512</text><text x="58" y="380" font-size="15" fill="#6d7c90" font-weight="600" text-anchor="middle">M = 256</text><rect x="110" y="200" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="207" y="234" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 0,0</text><text x="207" y="255" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="315" y="200" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="412" y="234" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 0,1</text><text x="412" y="255" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="520" y="200" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="617" y="234" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 0,2</text><text x="617" y="255" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="725" y="200" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="822" y="234" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 0,3</text><text x="822" y="255" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="110" y="278" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="207" y="312" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 1,0</text><text x="207" y="333" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="315" y="278" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="412" y="312" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 1,1</text><text x="412" y="333" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="520" y="278" width="195" height="70" rx="8" fill="#a9d4c0" stroke="none"/><text x="617" y="312" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">CTA 1,2</text><text x="617" y="333" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">64 × 128</text><rect x="725" y="278" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="822" y="312" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 1,3</text><text x="822" y="333" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="110" y="356" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="207" y="390" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 2,0</text><text x="207" y="411" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="315" y="356" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="412" y="390" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 2,1</text><text x="412" y="411" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="520" y="356" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="617" y="390" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 2,2</text><text x="617" y="411" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="725" y="356" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="822" y="390" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 2,3</text><text x="822" y="411" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="110" y="434" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="207" y="468" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 3,0</text><text x="207" y="489" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="315" y="434" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="412" y="468" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 3,1</text><text x="412" y="489" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="520" y="434" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="617" y="468" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 3,2</text><text x="617" y="489" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><rect x="725" y="434" width="195" height="70" rx="8" fill="#eef3f9" stroke="none"/><text x="822" y="468" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="middle">CTA 3,3</text><text x="822" y="489" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">64 × 128</text><path d="M90 196 L90 512" fill="none" stroke="#d8e0e9" stroke-width="2"/><path d="M106 512 L930 512" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="64" y="562" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">高亮的 CTA(1,2) 负责 C 的第 64–127 行、第 256–383 列。</text><text x="64" y="594" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">Grid = ⌈512/128⌉ × ⌈256/64⌉ = 4 × 4 = 16。一个 CTA 负责一块结果，K 方向还一个都没碰。</text></g></svg>