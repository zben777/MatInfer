<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">get_best_config 从 shape 到 kernel 配置的四步搜索</title><desc id="desc">枚举候选布局、用 L1/L2 周期模型打分、选最小周期者、推导 swizzle 和流水线级数与线程数。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="700" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">从 shape 到配置：一次搜索，不是几条 if-else</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">get_best_config（common.hpp:18）→ sm90.hpp 247 行，四步。</text>
<rect x="40" y="150" width="920" height="112" rx="10" fill="#f1f4fb" stroke="#d8e0e9"/><text x="64" y="178" font-size="15" fill="#4967b0" font-weight="600" text-anchor="start">① 枚举候选布局　get_layout_candidates（:16-118）</text><text x="64" y="204" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">block_m {64,128}（小矩阵补 16/32，BF16 输出才给 256）　·　block_k = 128×8/位宽 = 128</text><text x="64" y="228" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">block_n 16→256/192/160，步进 lcm(16,multiple)；cluster 1 或 2，SM 数须整除</text><text x="64" y="250" font-size="13" fill="#b3543c" font-weight="400" text-anchor="start">三道门槛：m、n 不同时&gt;128（寄存器）· swizzle≥64B · stage≥3（小分块≥4）</text>
<line x1="500" y1="262" x2="500" y2="282" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="284" width="920" height="120" rx="10" fill="#f7f9fc" stroke="#d8e0e9"/><text x="64" y="312" font-size="15" fill="#218575" font-weight="600" text-anchor="start">② 逐个打分　get_layout_info（:202-239）</text><text x="64" y="338" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">L2 字节 = K × (block_m/cluster_n + block_n/cluster_m) × 元素宽度　← multicast 省下的</text><text x="64" y="362" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">L1 字节 = K × (block_m + block_n) × 元素宽度 + C/D 读写</text><text x="64" y="386" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">num_cycles = max(L1, L2 cycles) / wave_efficiency　·　HBM 与算力当常量忽略</text>
<line x1="500" y1="404" x2="500" y2="424" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="426" width="920" height="62" rx="10" fill="#f1f4fb" stroke="#d8e0e9"/><text x="64" y="454" font-size="15" fill="#4967b0" font-weight="600" text-anchor="start">③ 选优　compare（:242-244）</text><text x="64" y="478" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">取 num_cycles 最小的那个布局——单 wave 时 multicast 候选直接判出局（:234-236）</text>
<line x1="500" y1="488" x2="500" y2="508" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="510" width="920" height="118" rx="10" fill="#f7f9fc" stroke="#d8e0e9"/><text x="64" y="538" font-size="15" fill="#218575" font-weight="600" text-anchor="start">④ 从赢家推导其余配置</text><text x="64" y="564" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">swizzle：由内层维度定，major=K 用 block_k，否则用 block_m/n（:132-139）</text><text x="64" y="588" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">num_stages = min((232448 − 固定开销) / 每级开销, 16)　·　SM90 smem 容量（:14,180-182）</text><text x="64" y="612" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">线程 = 128 TMA + (block_m≤64 ? 128 : 256) 计算（:190-200）</text>
<text x="40" y="660" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">调试开关：DG_PRINT_CONFIGS=1 打印每次 shape 选中的配置（common.hpp:47-54）</text><text x="960" y="660" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">源：commit 5081f851</text>
</g></svg>
