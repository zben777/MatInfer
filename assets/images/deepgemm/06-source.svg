<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" role="img" aria-labelledby="title desc"><title id="title">三个数字，三条来路</title><desc id="desc">它们不是搜出来的，是从各自的约束里解出来的。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="646" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 06</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">三个数字，三条来路</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">它们不是搜出来的，是从各自的约束里解出来的。</text><rect x="40" y="146" width="293" height="420" rx="12" fill="#f7f9fc" stroke="none"/><rect x="353" y="146" width="293" height="420" rx="12" fill="#f7f9fc" stroke="none"/><rect x="666" y="146" width="294" height="420" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="186" font-size="22" fill="#218575" font-weight="600" text-anchor="start">B_K</text><text x="64" y="214" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">由数据类型定死</text><rect x="64" y="236" width="245" height="52" rx="8" fill="#eef4f0" stroke="none"/><text x="186" y="270" font-size="18" fill="#24334a" font-weight="600" text-anchor="middle">128 × 8 ÷ 位宽</text><text x="64" y="334" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">BF16</text><text x="186" y="336" font-size="14" fill="#b3becc" font-weight="400" text-anchor="middle">16 bit</text><text x="309" y="334" font-size="19" fill="#218575" font-weight="600" text-anchor="end">64</text><text x="64" y="390" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">FP8 / FP4</text><text x="186" y="392" font-size="14" fill="#b3becc" font-weight="400" text-anchor="middle">8 bit</text><text x="309" y="390" font-size="19" fill="#218575" font-weight="600" text-anchor="end">128</text><text x="64" y="446" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">MXF4</text><text x="186" y="448" font-size="14" fill="#b3becc" font-weight="400" text-anchor="middle">4 bit</text><text x="309" y="446" font-size="19" fill="#218575" font-weight="600" text-anchor="end">256</text><text x="64" y="500" font-size="15" fill="#218575" font-weight="600" text-anchor="start">一行恰好 128 字节</text><text x="64" y="526" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">和 shared memory 的</text><text x="64" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">swizzle 原子同宽</text><text x="377" y="186" font-size="22" fill="#4967b0" font-weight="600" text-anchor="start">流水线级数</text><text x="377" y="214" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">由片上容量反推</text><rect x="377" y="232" width="245" height="60" rx="8" fill="#f1f4fb" stroke="none"/><text x="499" y="260" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">（容量 − 额外）÷ 每阶段</text><text x="499" y="281" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">上限 16</text><rect x="377" y="302" width="245" height="44" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="393" y="328" font-size="15" fill="#24334a" font-weight="600" text-anchor="start">容量 227 KB</text><text x="606" y="328" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">Hopper 一块 SM</text><rect x="377" y="360" width="245" height="44" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="393" y="386" font-size="15" fill="#24334a" font-weight="600" text-anchor="start">每阶段 12 KB</text><text x="606" y="386" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">BK=32、FP16 时</text><rect x="377" y="418" width="245" height="44" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="393" y="444" font-size="15" fill="#24334a" font-weight="600" text-anchor="start">级数 ≥ 3</text><text x="606" y="444" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">否则直接淘汰</text><text x="377" y="520" font-size="15" fill="#4967b0" font-weight="600" text-anchor="start">块越大，级数越少</text><text x="690" y="186" font-size="22" fill="#c88735" font-weight="600" text-anchor="start">B_M、B_N</text><text x="690" y="214" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">被寄存器卡住</text><rect x="690" y="236" width="246" height="52" rx="8" fill="#fbf6ee" stroke="none"/><text x="813" y="270" font-size="18" fill="#24334a" font-weight="600" text-anchor="middle">至少一维 ≤ 128</text><rect x="690" y="300" width="246" height="42" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="706" y="326" font-size="15" fill="#24334a" font-weight="600" text-anchor="start">64 × 128</text><text x="920" y="326" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">8192 个累加器</text><rect x="690" y="356" width="246" height="42" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="706" y="382" font-size="15" fill="#24334a" font-weight="600" text-anchor="start">128 × 128</text><text x="920" y="382" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">16384 个</text><rect x="690" y="412" width="246" height="42" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="706" y="438" font-size="15" fill="#c88735" font-weight="600" text-anchor="start">128 × 256</text><text x="920" y="438" font-size="13" fill="#c88735" font-weight="400" text-anchor="end">32768 个 · 淘汰</text><text x="690" y="500" font-size="15" fill="#c88735" font-weight="600" text-anchor="start">两维都超就出局</text><text x="690" y="526" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">线程数按 B_M 翻倍</text><text x="690" y="546" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">把每人份数压回 B_N/2</text></g></svg>