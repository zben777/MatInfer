<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" role="img" aria-labelledby="title desc"><title id="title">算术强度只由块的两个边决定</title><desc id="desc">沿 K 切几刀、每刀多宽，都不改变这些值。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="632" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">算术强度只由块的两个边决定</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">沿 K 切几刀、每刀多宽，都不改变这些值。</text><rect x="80" y="451.55555555555554" width="120" height="60.44444444444444" rx="4" fill="#218575" stroke="none"/><text x="140" y="437.55555555555554" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">32</text><text x="140" y="540" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">64×64</text><rect x="260" y="431.4074074074074" width="120" height="80.59259259259258" rx="4" fill="#218575" stroke="none"/><text x="320" y="417.4074074074074" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">42.67</text><text x="320" y="540" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">64×128</text><text x="320" y="562" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="middle">材料里的取法</text><rect x="440" y="391.1111111111111" width="120" height="120.88888888888889" rx="4" fill="#218575" stroke="none"/><text x="500" y="377.1111111111111" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">64</text><text x="500" y="540" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">128×128</text><rect x="620" y="350.81481481481484" width="120" height="161.18518518518516" rx="4" fill="#218575" stroke="none"/><text x="680" y="336.81481481481484" font-size="16" fill="#24334a" font-weight="600" text-anchor="middle">85.33</text><text x="680" y="540" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">128×256</text><rect x="800" y="189.62962962962968" width="120" height="322.3703703703703" rx="4" fill="#e4e9f0" stroke="none"/><text x="860" y="175.62962962962968" font-size="16" fill="#6d7c90" font-weight="600" text-anchor="middle">170.67</text><text x="860" y="540" font-size="14" fill="#24334a" font-weight="600" text-anchor="middle">256×512</text><text x="860" y="562" font-size="12" fill="#b3becc" font-weight="400" text-anchor="middle">片上放不下</text><path d="M60 512 L950 512" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="60" y="156" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">FLOP/Byte</text><path d="M60 156 L80 156" fill="none" stroke="#d8e0e9" stroke-width="2"/><rect x="40" y="552" width="920" height="62" rx="10" fill="#fbf6ee" stroke="none"/><text x="64" y="580" font-size="16" fill="#c88735" font-weight="600" text-anchor="start">朴素写法是 0.5 FLOP/Byte，在这张图的刻度下贴着基线——比最矮的柱子还低 64 倍。</text><text x="64" y="604" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">五根柱子逐一代入 B_K = 16 / 32 / 64 / 128，得到的仍是同一个数。</text></g></svg>