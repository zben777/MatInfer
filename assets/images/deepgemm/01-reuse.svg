chor="middle">→</text><text x="430" y="542" font-size="19" fill="#218575" font-weight="600" text-anchor="start">切块 786,432 次</text><text x="64" y="578" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">差 85.33 倍。这个倍数恰好是切块后算术强度的两倍——下面会看到为什么。</text></g></svg>