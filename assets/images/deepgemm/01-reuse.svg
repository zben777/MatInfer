<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" role="img" aria-labelledby="title desc"><title id="title">同一份数据，能服务几个输出元素</title><desc id="desc">切块只做一件事：让搬进来的数据被更多输出元素共用。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="646" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">同一份数据，能服务几个输出元素</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">切块只做一件事：让搬进来的数据被更多输出元素共用。</text><rect x="40" y="146" width="430" height="292" rx="12" fill="#fbf1ec" stroke="none"/><rect x="530" y="146" width="430" height="292" rx="12" fill="#eef4f0" stroke="none"/><text x="64" y="182" font-size="21" fill="#c88735" font-weight="600" text-anchor="start">不切块</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">搬一次，服务一个元素</text><rect x="96" y="252" width="116" height="52" rx="8" fill="#f0d9c0" stroke="none"/><text x="154" y="284" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">A[m][k]</text><path d="M216 278 L282 278" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="288" y="252" width="116" height="52" rx="8" fill="#ffffff" stroke="#d8e0e9"/><text x="346" y="284" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">C[m][n]</text><text x="64" y="400" font-size="16" fill="#c88735" font-weight="600" text-anchor="start">A 的第 m 行被读了 N 遍</text><text x="64" y="424" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">——每个输出列各读一次，谁也没占便宜。</text><text x="554" y="182" font-size="21" fill="#218575" font-weight="600" text-anchor="start">按 64×128 切块</text><text x="554" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">搬一次，服务 128 个元素</text><rect x="554" y="252" width="116" height="52" rx="8" fill="#a9d4c0" stroke="none"/><text x="612" y="284" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">A[m][k]</text><path d="M674 278 L722 278" fill="none" stroke="#218575" stroke-width="2" marker-end="url(#arrow)"/><rect x="736" y="240" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="253" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="266" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="279" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="292" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="305" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="736" y="318" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="240" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="253" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="266" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="279" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="292" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="305" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="749" y="318" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="240" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="253" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="266" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="279" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="292" width="9" height="9" rx="2" fill="#218575" stroke="none"/><rect x="762" y="305" width="9" height="9" rx="2" fill="#21