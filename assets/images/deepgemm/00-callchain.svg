<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">一行 Python 调用穿过五层</title><desc id="desc">从 Python API 到 CUDA 模板，每一层只做一件事，配置越往下越具体。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="620" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / DEEPGEMM / 00</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">一行调用，穿过五层</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">每层只做一件事，配置越往下越具体。</text><rect x="40" y="150" width="920" height="60" rx="10" fill="#f1f4fb" stroke="#d8e0e9"/><text x="64" y="176" font-size="14" fill="#4967b0" font-weight="600" text-anchor="start">01　Python API</text><text x="64" y="198" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">deep_gemm/__init__.py　→　fp8_gemm_nt(a, b, d, ...)</text><text x="936" y="187" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">用户看到的名字</text><line x1="500" y1="210" x2="500" y2="228" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="230" width="920" height="60" rx="10" fill="#f7f9fc" stroke="#d8e0e9"/><text x="64" y="256" font-size="14" fill="#218575" font-weight="600" text-anchor="start">02　pybind11 绑定</text><text x="64" y="278" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">csrc/python_api.cpp　→　把 torch::Tensor 接进 C++</text><text x="936" y="267" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">语言边界</text><line x1="500" y1="290" x2="500" y2="308" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="310" width="920" height="76" rx="10" fill="#f1f4fb" stroke="#d8e0e9"/><text x="64" y="336" font-size="14" fill="#4967b0" font-weight="600" text-anchor="start">03　C++ 入口与分派</text><text x="64" y="358" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">csrc/apis/gemm.hpp:78　校验 shape、转 scale 布局、按架构分派</text><text x="64" y="378" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">SM90 + FP32 SF → 1d1d / 1d2D　　SM100 + packed SF → fp4 路径</text><text x="936" y="349" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">决定走哪条路</text><line x1="500" y1="386" x2="500" y2="404" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="406" width="920" height="76" rx="10" fill="#f7f9fc" stroke="#d8e0e9"/><text x="64" y="432" font-size="14" fill="#218575" font-weight="600" text-anchor="start">04　JIT 装配</text><text x="64" y="454" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">impls/sm90_fp8_gemm_1d1d.hpp:75　GemmDesc → get_best_config → 拼模板实参</text><text x="64" y="474" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">建 5 个 TMA descriptor：A / B / SFA / SFB / CD</text><text x="936" y="445" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">选配置、编译</text><line x1="500" y1="482" x2="500" y2="500" stroke="#b3becc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="502" width="920" height="60" rx="10" fill="#fbf6ee" stroke="#e6d5bb"/><text x="64" y="528" font-size="14" fill="#c88735" font-weight="600" text-anchor="start">05　CUDA 模板</text><text x="64" y="550" font-size="14" fill="#24334a" font-weight="400" text-anchor="start">include/deep_gemm/impls/sm90_fp8_gemm_1d1d.cuh　TMA + WGMMA + 流水线</text><text x="936" y="539" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="end">真正干活</text><text x="40" y="594" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">一个反直觉的事实：nn / tn / tt 没有独立 kernel，都是 transpose 后调 nt。</text></g></svg>
