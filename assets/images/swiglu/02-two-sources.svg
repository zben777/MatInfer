<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" role="img" aria-labelledby="title desc"><title id="title">门是从值里读出来的，还是另算出来的</title><desc id="desc">左边一条投影，门搭在中间值上；右边两条投影，门由自己那块权重生产。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="648" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / SWIGLU / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">门是从值里读出来的，还是另算出来的</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">左边一条投影，门搭在中间值上；右边两条投影，门由自己那块权重生产。</text><rect x="40" y="146" width="440" height="400" rx="12" fill="#fdf6ec" stroke="none"/><rect x="520" y="146" width="440" height="400" rx="12" fill="#eef4f0" stroke="none"/><text x="64" y="182" font-size="21" fill="#c88735" font-weight="600" text-anchor="start">普通 FFN</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">一块投影，门只能读值</text><rect x="214" y="232" width="92" height="46" rx="8" fill="#ffffff" stroke="none"/><text x="260" y="261" font-size="17" fill="#24334a" font-weight="600" text-anchor="middle">x</text><path d="M260 278 L260 302" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="186" y="304" width="148" height="46" rx="8" fill="#f0d9c0" stroke="none"/><text x="260" y="333" font-size="17" fill="#c88735" font-weight="600" text-anchor="middle">W₁</text><path d="M260 350 L260 374" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="202" y="376" width="116" height="46" rx="8" fill="#ffffff" stroke="none"/><text x="260" y="405" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">z = W₁x</text><path d="M260 422 L260 446" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="172" y="448" width="176" height="46" rx="8" fill="#f0d9c0" stroke="none"/><text x="260" y="477" font-size="15" fill="#c88735" font-weight="600" text-anchor="middle">g(z)   →   W₂</text><text x="260" y="522" font-size="14" fill="#c88735" font-weight="600" text-anchor="middle">门 = g(z)　一个数管两件事</text><text x="544" y="182" font-size="21" fill="#218575" font-weight="600" text-anchor="start">GLU</text><text x="544" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">两条投影，门自己算</text><rect x="694" y="232" width="92" height="46" rx="8" fill="#ffffff" stroke="none"/><text x="740" y="261" font-size="17" fill="#24334a" font-weight="600" text-anchor="middle">x</text><path d="M716 278 L716 300 L600 300 L600 314" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M764 278 L764 300 L880 300 L880 314" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="316" width="148" height="46" rx="8" fill="#a9d4c0" stroke="none"/><text x="618" y="345" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">W_up x</text><rect x="788" y="316" width="148" height="46" rx="8" fill="#a9d4c0" stroke="none"/><text x="862" y="345" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">W_gate x</text><path d="M618 362 L618 390" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M862 362 L862 390" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="392" width="148" height="44" rx="8" fill="#ffffff" stroke="none"/><text x="618" y="420" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">内容 a</text><rect x="788" y="392" width="148" height="44" rx="8" fill="#cfe8dd" stroke="none"/><text x="862" y="420" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">SiLU(b)</text><path d="M618 436 L618 470 L660 470" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><path d="M862 436 L862 470 L820 470" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="448" width="160" height="44" rx="8" fill="#a9d4c0" stroke="none"/><text x="740" y="476" font-size="15" fill="#24334a" font-weight="600" text-anchor="middle">⊙  →  W_down</text><text x="740" y="522" font-size="14" fill="#218575" font-weight="600" text-anchor="middle">门 = σ(W_gate x)　独立于 a</text><text x="40" y="600" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">两条路都逐位置，FFN 的位置独立性没有被碰过。差别只在门的出身：一个搭在 z 上，一个由 W_gate 专门生产。</text><text x="40" y="628" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">右边那块多出来的权重，就是&quot;让门能独立于值去学&quot;所付的全部代价。</text></g></svg>