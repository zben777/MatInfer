<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 574" role="img" aria-labelledby="title desc"><title id="title">一个在通道维调闸，一个在专家维择路</title><desc id="desc">两种&quot;自适应&quot;作用在不同的轴上，互不冲突，今天的模型常常一起用。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="574" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / SWIGLU / 05</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">一个在通道维调闸，一个在专家维择路</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">两种&quot;自适应&quot;作用在不同的轴上，互不冲突，今天的模型常常一起用。</text><rect x="40" y="146" width="440" height="306" rx="12" fill="#eef4f0" stroke="none"/><rect x="520" y="146" width="440" height="306" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="182" font-size="20" fill="#218575" font-weight="600" text-anchor="start">SwiGLU：调闸</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">m 个通道，各自一个连续开度</text><rect x="70" y="262.0" width="24" height="138.0" rx="4" fill="#218575" stroke="none"/><rect x="101" y="328.0" width="24" height="72.0" rx="4" fill="#218575" stroke="none"/><rect x="132" y="289.0" width="24" height="111.0" rx="4" fill="#218575" stroke="none"/><rect x="163" y="355.0" width="24" height="45.0" rx="4" fill="#218575" stroke="none"/><rect x="194" y="250.0" width="24" height="150.0" rx="4" fill="#218575" stroke="none"/><rect x="225" y="334.0" width="24" height="66.0" rx="4" fill="#218575" stroke="none"/><rect x="256" y="271.0" width="24" height="129.0" rx="4" fill="#218575" stroke="none"/><rect x="287" y="313.0" width="24" height="87.0" rx="4" fill="#218575" stroke="none"/><rect x="318" y="349.0" width="24" height="51.00000000000001" rx="4" fill="#218575" stroke="none"/><rect x="349" y="256.0" width="24" height="144.0" rx="4" fill="#218575" stroke="none"/><rect x="380" y="322.0" width="24" height="78.0" rx="4" fill="#218575" stroke="none"/><rect x="411" y="295.0" width="24" height="105.0" rx="4" fill="#218575" stroke="none"/><path d="M64 400 L468 400" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="64" y="430" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">每个 token 都把 m 个通道算满，变的只是通过多少。</text><text x="544" y="182" font-size="20" fill="#4967b0" font-weight="600" text-anchor="start">MoE：择路</text><text x="544" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">N 个专家，每个 token 只走少数几个</text><rect x="566" y="234" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="606" y="264" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E0</text><text x="606" y="284" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><rect x="662" y="234" width="80" height="62" rx="8" fill="#cfe0f7" stroke="none"/><text x="702" y="264" font-size="16" fill="#4967b0" font-weight="600" text-anchor="middle">E1</text><text x="702" y="284" font-size="12" fill="#4967b0" font-weight="500" text-anchor="middle">激活</text><rect x="758" y="234" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="798" y="264" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E2</text><text x="798" y="284" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><rect x="854" y="234" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="894" y="264" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E3</text><text x="894" y="284" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><rect x="566" y="312" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="606" y="342" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E4</text><text x="606" y="362" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><rect x="662" y="312" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="702" y="342" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E5</text><text x="702" y="362" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><rect x="758" y="312" width="80" height="62" rx="8" fill="#cfe0f7" stroke="none"/><text x="798" y="342" font-size="16" fill="#4967b0" font-weight="600" text-anchor="middle">E6</text><text x="798" y="362" font-size="12" fill="#4967b0" font-weight="500" text-anchor="middle">激活</text><rect x="854" y="312" width="80" height="62" rx="8" fill="#ffffff" stroke="none"/><text x="894" y="342" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="middle">E7</text><text x="894" y="362" font-size="12" fill="#b3becc" font-weight="500" text-anchor="middle">闲置</text><text x="544" y="430" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">被选中的专家才算，其余的这一步不动。</text><text x="40" y="492" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">SwiGLU 与 MoE 不互相替代：一个是连续的通过量，一个是离散的选择。</text><text x="40" y="518" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">今天的主流配置是两者叠用——FFN 内部是 SwiGLU，FFN 整体被切成 MoE。</text><text x="40" y="544" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">两者都成立，靠的是同一条性质：FFN 逐位置，改它的宽度和路由方式不会牵动别的位置。</text></g></svg>