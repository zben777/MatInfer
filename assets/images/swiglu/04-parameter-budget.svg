<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" role="img" aria-labelledby="title desc"><title id="title">多出来的那条投影要付钱</title><desc id="desc">d = 4096。同样 8d² 的参数预算，普通 FFN 用两块矩阵花掉，SwiGLU 要用三块。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="626" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / SWIGLU / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">多出来的那条投影要付钱</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">d = 4096。同样 8d² 的参数预算，普通 FFN 用两块矩阵花掉，SwiGLU 要用三块。</text><rect x="40" y="168" width="920" height="100" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="202" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">普通 FFN</text><text x="64" y="228" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">m = 4d = 16384</text><rect x="300.0" y="198" width="161.0" height="32" rx="4" fill="#218575" stroke="none"/><rect x="467.0" y="198" width="161.0" height="32" rx="4" fill="#218575" stroke="none"/><text x="936" y="220" font-size="17" fill="#218575" font-weight="600" text-anchor="end">8d² = 134.2 M</text><rect x="40" y="284" width="920" height="100" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="318" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">SwiGLU 硬撑 4d</text><text x="64" y="344" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">m = 4d = 16384</text><rect x="300.0" y="314" width="161.0" height="32" rx="4" fill="#e3b177" stroke="none"/><rect x="467.0" y="314" width="161.0" height="32" rx="4" fill="#c88735" stroke="none"/><rect x="632.0" y="314" width="161.0" height="32" rx="4" fill="#a86f28" stroke="none"/><text x="936" y="336" font-size="17" fill="#c88735" font-weight="600" text-anchor="end">12d² = 201.3 M</text><rect x="40" y="400" width="920" height="100" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="434" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">SwiGLU 缩到 8d/3</text><text x="64" y="460" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">m = 10922.67（LLaMA 取 11008）</text><rect x="300.0" y="430" width="106.0" height="32" rx="4" fill="#e3b177" stroke="none"/><rect x="412.0" y="430" width="106.0" height="32" rx="4" fill="#c88735" stroke="none"/><rect x="522.0" y="430" width="106.0" height="32" rx="4" fill="#a86f28" stroke="none"/><text x="936" y="452" font-size="17" fill="#218575" font-weight="600" text-anchor="end">3dm = 8d² = 134.2 M</text><path d="M630 154 L630 512" fill="none" stroke="#c88735" stroke-width="2" stroke-dasharray="6 5"/><text x="630" y="148" font-size="14" fill="#c88735" font-weight="600" text-anchor="middle">8d² 预算线</text><rect x="40" y="522" width="920" height="66" rx="10" fill="#fbf6ee" stroke="none"/><text x="64" y="552" font-size="16" fill="#c88735" font-weight="600" text-anchor="start">m = 8d/3 不是抄来的常数，它是从 3dm = 8d² 反解出来的：三块矩阵的参数量，要等于原来两块。</text><text x="64" y="578" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">三块分别是门投影、内容投影与降维——前两块等大，最后一块是它们的镜像。</text></g></svg>