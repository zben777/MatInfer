t="400" text-anchor="middle">router logit  z</text><rect x="700" y="140" width="260" height="400" rx="12" fill="#f1f4fb" stroke="none"/><text x="724" y="176" font-size="17" fill="#24334a" font-weight="600" text-anchor="start">同一个 z 区间上的变化</text><text x="724" y="204" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">z：6 → 8</text><text x="724" y="250" font-size="17" fill="#4967b0" font-weight="600" text-anchor="start">Sigmoid</text><text x="724" y="276" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">0.99753 → 0.99966</text><text x="724" y="300" font-size="16" fill="#4967b0" font-weight="500" text-anchor="start">相对变化 0.21%</text><path d="M724 322 L936 322" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="724" y="354" font-size="17" fill="#218575" font-weight="600" text-anchor="start">Sqrt(Softplus)</text><text x="724" y="380" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">2.44999 → 2.82849</text><text x="724" y="404" font-size="16" fill="#218575" font-weight="500" text-anchor="start">相对变化 15.4%</text><path d="M724 426 L936 426" fill="none" stroke="#d8e0e9" stroke-width="2"/><text x="724" y="456" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">归一化后的权重几乎一样</text><text x="724" y="480" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">0.305 / 0.380 / 0.315</text><text x="724" y="504" font-size="15" fill="#24334a" font-weight="400" text-anchor="start">对 0.300 / 0.387 / 0.313</text><text x="40" y="600" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">V4 报告只有一句话交待这次更换，没有论证。上面是从函数形状倒推它能解决什么：换掉的不是分布形状，</text><text x="40" y="628" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">而是&quot;分数撞到上限&quot;这件事本身 —— 专家数涨到几百之后，几百个 logit 里总有偏大的。</text></g></svg>