<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Node-Limited Routing 砍掉的是什么</title><desc id="desc">256 个路由专家分成 8 组、每组 32 个，一组占一个节点。约束的是&quot;触达几个节点&quot;，不是&quot;选几个专家&quot;。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="620" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / MOE / 06</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">Node-Limited Routing 砍掉的是什么</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">256 个路由专家分成 8 组、每组 32 个，一组占一个节点。约束的是&quot;触达几个节点&quot;，不是&quot;选几个专家&quot;。</text><rect x="40" y="146" width="440" height="330" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="180" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">无约束：8 个专家触达 8 个节点</text><text x="64" y="206" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">M = 8，每个专家的 token 各走一次跨节点通信</text><rect x="64" y="220" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="236" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 1</text><rect x="240" y="224" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="245" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="261" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 2</text><rect x="240" y="249" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="270" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="286" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 3</text><rect x="240" y="274" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="295" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="311" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 4</text><rect x="240" y="299" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="320" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="336" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 5</text><rect x="240" y="324" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="345" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="361" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 6</text><rect x="240" y="349" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="370" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="386" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 7</text><rect x="240" y="374" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><rect x="64" y="395" width="392" height="21" rx="5" fill="#fbf3e6" stroke="none"/><text x="78" y="411" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="start">节点 8</text><rect x="240" y="399" width="202" height="13" rx="3" fill="#e8cfa8" stroke="none"/><text x="64" y="448" font-size="17" fill="#c88735" font-weight="600" text-anchor="start">IB 通信量 8t</text><rect x="520" y="146" width="440" height="330" rx="12" fill="#edf7f2" stroke="none"/><text x="544" y="180" font-size="19" fill="#24334a" font-weight="600" text-anchor="start">Node-Limited：最多触达 4 个节点</text><text x="544" y="206" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">先挑累计亲和分最高的 4 个节点，再在这 4×32 个专家里选</text><rect x="544" y="220" width="392" height="21" rx="5" fill="#dceee6" stroke="none"/><text x="558" y="236" font-size="13" fill="#24334a" font-weight="400" text-anchor="start">节点 1</text><rect x="720" y="224" width="202" height="13" rx="3" fill="#a9d4c0" stroke="none"/><rect x="544" y="245" width="392" height="21" rx="5" fill="#dceee6" stroke="none"/><text x="558" y="261" font-size="13" fill="#24334a" font-weight="400" text-anchor="start">节点 2</text><rect x="720" y="249" width="202" height="13" rx="3" fill="#a9d4c0" stroke="none"/><rect x="544" y="270" width="392" height="21" rx="5" fill="#dceee6" stroke="none"/><text x="558" y="286" font-size="13" fill="#24334a" font-weight="400" text-anchor="start">节点 3</text><rect x="720" y="274" width="202" height="13" rx="3" fill="#a9d4c0" stroke="none"/><rect x="544" y="295" width="392" height="21" rx="5" fill="#dceee6" stroke="none"/><text x="558" y="311" font-size="13" fill="#24334a" font-weight="400" text-anchor="start">节点 4</text><rect x="720" y="299" width="202" height="13" rx="3" fill="#a9d4c0" stroke="none"/><rect x="544" y="320" width="392" height="21" rx="5" fill="#eef1f6" stroke="none"/><text x="558" y="336" font-size="13" fill="#b3becc" font-weight="400" text-anchor="start">节点 5</text><text x="922" y="336" font-size="13" fill="#b3becc" font-weight="400" text-anchor="end">不触达</text><rect x="544" y="345" width="392" height="21" rx="5" fill="#eef1f6" stroke="none"/><text x="558" y="361" font-size="13" fill="#b3becc" font-weight="400" text-anchor="start">节点 6</text><text x="922" y="361" font-size="13" fill="#b3becc" font-weight="400" text-anchor="end">不触达</text><rect x="544" y="370" width="392" height="21" rx="5" fill="#eef1f6" stroke="none"/><text x="558" y="386" font-size="13" fill="#b3becc" font-weight="400" text-anchor="start">节点 7</text><text x="922" y="386" font-size="13" fill="#b3becc" font-weight="400" text-anchor="end">不触达</text><rect x="544" y="395" width="392" height="21" rx="5" fill="#eef1f6" stroke="none"/><text x="558" y="411" font-size="13" fill="#b3becc" font-weight="400" text-anchor="start">节点 8</text><text x="922" y="411" font-size="13" fill="#b3becc" font-weight="400" text-anchor="end">不触达</text><text x="544" y="448" font-size="16" fill="#218575" font-weight="600" text-anchor="start">IB 通信量最多 4t，叠加 NVLink 转发</text><text x="544" y="472" font-size="16" fill="#218575" font-weight="600" text-anchor="start">有效通信用时接近减半</text><rect x="40" y="496" width="920" height="104" rx="10" fill="#fbf3e6" stroke="none"/><text x="64" y="530" font-size="18" fill="#c88735" font-weight="600" text-anchor="start">这是用模型质量补贴通信开销</text><text x="64" y="558" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">路由的自由度被砍了：本来能在全部 256 个专家里挑最好的 8 个，现在只能在 4×32 个里挑。</text><text x="64" y="584" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">V4 把这条约束去掉了，改用通信-计算 overlap 接住这笔账 —— 交换方向的反转本身就是信号。</text></g></svg>