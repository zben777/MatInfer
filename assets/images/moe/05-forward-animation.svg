<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">1×6 一次完整前向（动画）</title><desc id="desc">五个步骤循环播放。图中数值与正文可逐项对照，全部经脚本核过。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><style>@keyframes sw{0%,19.9%{opacity:1}20%,100%{opacity:0}}.f{animation:sw 12s linear infinite;opacity:0}.f1{animation-delay:0s}.f2{animation-delay:2.4s}.f3{animation-delay:4.8s}.f4{animation-delay:7.2s}.f5{animation-delay:9.6s}@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:0}.f5{opacity:1}}</style><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="420" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / MOE / 05</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">1×6 一次完整前向（动画）</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">五个步骤循环播放。图中数值与正文可逐项对照，全部经脚本核过。</text><g class="f f1"><rect x="40" y="152" width="920" height="216" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="194" font-size="24" fill="#4967b0" font-weight="600" text-anchor="start">① 路由打分</text><text x="64" y="230" font-size="19" fill="#24334a" font-weight="400" text-anchor="start">s = [ 1/2, 4/5, 1/5, 9/10, 1/10, 3/5, 3/10 ]</text><text x="64" y="262" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">logit 写成 ln 形式，Sigmoid 的输出就是干净分数</text><text x="528" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E3</text><rect x="528" y="208" width="72" height="120" rx="4" fill="#4967b0" stroke="none"/><text x="564" y="198" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">4/5</text><text x="636" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E5</text><rect x="636" y="193" width="72" height="135" rx="4" fill="#4967b0" stroke="none"/><text x="672" y="183" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">9/10</text><text x="744" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E7</text><rect x="744" y="238" width="72" height="90" rx="4" fill="#4967b0" stroke="none"/><text x="780" y="228" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">3/5</text></g><g class="f f2"><rect x="40" y="152" width="920" height="216" rx="12" fill="#fbf3e6" stroke="none"/><text x="64" y="194" font-size="24" fill="#c88735" font-weight="600" text-anchor="start">② 加偏置后排序</text><text x="64" y="230" font-size="19" fill="#24334a" font-weight="400" text-anchor="start">s′ = s + b　→　Top-3 = E4, E5, E8</text><text x="64" y="262" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">E3 从 4/5 被压到 3/10 而出局，E4 从 1/5 被抬到 4/5 上位</text><text x="528" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E4</text><rect x="528" y="208" width="72" height="120" rx="4" fill="#c88735" stroke="none"/><text x="564" y="198" font-size="15" fill="#c88735" font-weight="600" text-anchor="middle">4/5</text><text x="636" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E5</text><rect x="636" y="208" width="72" height="120" rx="4" fill="#c88735" stroke="none"/><text x="672" y="198" font-size="15" fill="#c88735" font-weight="600" text-anchor="middle">4/5</text><text x="744" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E8</text><rect x="744" y="223" width="72" height="105" rx="4" fill="#c88735" stroke="none"/><text x="780" y="213" font-size="15" fill="#c88735" font-weight="600" text-anchor="middle">7/10</text></g><g class="f f3"><rect x="40" y="152" width="920" height="216" rx="12" fill="#edf7f2" stroke="none"/><text x="64" y="194" font-size="24" fill="#218575" font-weight="600" text-anchor="start">③ 归一化取权重</text><text x="64" y="230" font-size="19" fill="#24334a" font-weight="400" text-anchor="start">g = s / Σs = 1/7, 9/14, 3/14（不是 softmax）</text><text x="64" y="262" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">Σs = 1/5 + 9/10 + 3/10 = 7/5；三个权重加起来恰好是 1</text><text x="528" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E4</text><rect x="528" y="285" width="72" height="43" rx="4" fill="#218575" stroke="none"/><text x="564" y="275" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">1/7</text><text x="636" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E5</text><rect x="636" y="183" width="72" height="145" rx="4" fill="#218575" stroke="none"/><text x="672" y="173" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">9/14</text><text x="744" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E8</text><rect x="744" y="280" width="72" height="48" rx="4" fill="#218575" stroke="none"/><text x="780" y="270" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">3/14</text></g><g class="f f4"><rect x="40" y="152" width="920" height="216" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="194" font-size="24" fill="#4967b0" font-weight="600" text-anchor="start">④ 四个专家各自前向</text><text x="64" y="230" font-size="19" fill="#24334a" font-weight="400" text-anchor="start">y = 0.5811（共享 E1）, 1.1622, 1.7433, 0.7748</text><text x="64" y="262" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">c = Swish(0.6) = 0.387394；每个专家 y = 18c · u · δ</text><text x="528" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E1</text><rect x="528" y="270" width="72" height="58" rx="4" fill="#4967b0" stroke="none"/><text x="564" y="260" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">0.5811</text><text x="636" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E4</text><rect x="636" y="212" width="72" height="116" rx="4" fill="#4967b0" stroke="none"/><text x="672" y="202" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">1.1622</text><text x="744" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E5</text><rect x="744" y="154" width="72" height="174" rx="4" fill="#4967b0" stroke="none"/><text x="780" y="144" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">1.7433</text><text x="852" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E8</text><rect x="852" y="251" width="72" height="77" rx="4" fill="#4967b0" stroke="none"/><text x="888" y="241" font-size="15" fill="#4967b0" font-weight="600" text-anchor="middle">0.7748</text></g><g class="f f5"><rect x="40" y="152" width="920" height="216" rx="12" fill="#eef7f2" stroke="none"/><text x="64" y="194" font-size="24" fill="#218575" font-weight="600" text-anchor="start">⑤ 合并输出</text><text x="64" y="230" font-size="19" fill="#24334a" font-weight="400" text-anchor="start">y = 0.5811 + 0.1660 + 1.1207 + 0.1660 = 2.0338</text><text x="64" y="262" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">精确形式是 (21/4)·c；E4 与 E8 的贡献相同并非巧合</text><text x="528" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E1</text><rect x="528" y="270" width="72" height="58" rx="4" fill="#218575" stroke="none"/><text x="564" y="260" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">0.5811</text><text x="636" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E4</text><rect x="636" y="311" width="72" height="17" rx="4" fill="#218575" stroke="none"/><text x="672" y="288" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">0.1660</text><text x="744" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E5</text><rect x="744" y="216" width="72" height="112" rx="4" fill="#218575" stroke="none"/><text x="780" y="206" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">1.1207</text><text x="852" y="300" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">E8</text><rect x="852" y="311" width="72" height="17" rx="4" fill="#218575" stroke="none"/><text x="888" y="288" font-size="15" fill="#218575" font-weight="600" text-anchor="middle">0.1660</text></g><text x="40" y="400" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">图中柱高按各自帧内的最大值归一，只用于比较同一帧内各专家的大小。</text></g></svg>