<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">一次前向的账本：容量和算力被切开了</title><desc id="desc">同样的玩具模型（d_model = 3，大专家 d_ff = 12）。参数按 864 归一，乘加按 240 归一。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="620" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / MOE / 01</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">一次前向的账本：容量和算力被切开了</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">同样的玩具模型（d_model = 3，大专家 d_ff = 12）。参数按 864 归一，乘加按 240 归一。</text><text x="400" y="148" font-size="15" fill="#6d7c90" font-weight="500" text-anchor="start">挂上的参数</text><text x="700" y="148" font-size="15" fill="#6d7c90" font-weight="500" text-anchor="start">一次前向的乘加</text><rect x="40" y="166" width="920" height="116" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="208" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">普通 FFN（Dense）</text><text x="64" y="238" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">一个大专家，d_ff = 12</text><rect x="400" y="238" width="22.5" height="20" rx="4" fill="#4967b0" stroke="none"/><text x="434.5" y="274" font-size="19" fill="#4967b0" font-weight="600" text-anchor="start">108</text><rect x="700" y="238" width="90.0" height="20" rx="4" fill="#4967b0" stroke="none"/><text x="802.0" y="274" font-size="19" fill="#4967b0" font-weight="600" text-anchor="start">120</text><rect x="40" y="298" width="920" height="116" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="340" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">常规 MoE（8 选 2）</text><text x="64" y="370" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">8 个大专家，每 token 选 2 个</text><rect x="400" y="370" width="180.0" height="20" rx="4" fill="#c88735" stroke="none"/><text x="592.0" y="406" font-size="19" fill="#c88735" font-weight="600" text-anchor="start">864</text><rect x="700" y="370" width="180.0" height="20" rx="4" fill="#c88735" stroke="none"/><text x="892.0" y="406" font-size="19" fill="#c88735" font-weight="600" text-anchor="start">240</text><rect x="40" y="430" width="920" height="116" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="472" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">DeepSeekMoE 式</text><text x="64" y="502" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">16 个小专家（d_ff = 3），1 共享 + 3 路由</text><rect x="400" y="502" width="90.0" height="20" rx="4" fill="#218575" stroke="none"/><text x="502.0" y="538" font-size="19" fill="#218575" font-weight="600" text-anchor="start">432</text><rect x="700" y="502" width="90.0" height="20" rx="4" fill="#218575" stroke="none"/><text x="802.0" y="538" font-size="19" fill="#218575" font-weight="600" text-anchor="start">120</text><rect x="40" y="570" width="920" height="40" rx="10" fill="#eef7f2" stroke="none"/><text x="64" y="597" font-size="17" fill="#218575" font-weight="600" text-anchor="start">DeepSeekMoE 的 120 与 Dense 的 120 相等，因为激活的 4 个小专家合计 d_ff = 4 × 3 = 12。</text></g></svg>