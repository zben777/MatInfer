<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">偏置项只进排序，不进权重</title><desc id="desc">b 出现在 Top-K 的比较里，却不出现在 g 的算式里 —— 这一进一出就是&quot;零梯度&quot;的全部含义。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / MOE / 04</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">偏置项只进排序，不进权重</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">b 出现在 Top-K 的比较里，却不出现在 g 的算式里 —— 这一进一出就是&quot;零梯度&quot;的全部含义。</text><text x="64" y="172" font-size="18" fill="#24334a" font-weight="600" text-anchor="start">输入 x</text><path d="M160 166 L226 166" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="232" y="144" width="150" height="44" rx="8" fill="#eef1f6" stroke="none"/><text x="307" y="172" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">router 打分</text><path d="M388 166 L454 166" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="144" width="130" height="44" rx="8" fill="#eef1f6" stroke="none"/><text x="525" y="172" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">s = σ(z)</text><rect x="620" y="130" width="150" height="72" rx="8" fill="#fbf3e6" stroke="none"/><text x="695" y="160" font-size="18" fill="#c88735" font-weight="600" text-anchor="middle">偏置 b</text><text x="695" y="184" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="middle">不参与优化</text><path d="M770 166 L822 166" fill="none" stroke="#c88735" stroke-width="2" marker-end="url(#arrow)"/><rect x="828" y="144" width="132" height="44" rx="8" fill="#fbf3e6" stroke="none"/><text x="894" y="172" font-size="17" fill="#c88735" font-weight="600" text-anchor="middle">s + b 排序</text><path d="M610 188 L610 246" fill="none" stroke="#c88735" stroke-width="2"/><path d="M610 246 L826 246" fill="none" stroke="#c88735" stroke-width="2"/><path d="M826 246 L826 208" fill="none" stroke="#c88735" stroke-width="2" marker-end="url(#arrow)"/><text x="716" y="272" font-size="16" fill="#c88735" font-weight="600" text-anchor="middle">b 只走到这里：决定&quot;谁被选中&quot;，然后停下</text><rect x="40" y="306" width="920" height="116" rx="12" fill="#f1f4fb" stroke="none"/><text x="64" y="342" font-size="18" fill="#24334a" font-weight="600" text-anchor="start">Top-K 选出 3 个专家</text><text x="64" y="372" font-size="16" fill="#6d7c90" font-weight="400" text-anchor="start">选中集合来自 s + b 的排序</text><path d="M330 352 L396 352" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="402" y="330" width="220" height="44" rx="8" fill="#eef1f6" stroke="none"/><text x="512" y="358" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">g = s / Σs（原始分）</text><path d="M628 352 L694 352" fill="none" stroke="#b3becc" stroke-width="2" marker-end="url(#arrow)"/><rect x="700" y="330" width="230" height="44" rx="8" fill="#eef1f6" stroke="none"/><text x="815" y="358" font-size="17" fill="#24334a" font-weight="500" text-anchor="middle">g × 各专家输出求和</text><text x="64" y="404" font-size="16" fill="#4967b0" font-weight="500" text-anchor="start">权重算式里没有 b —— 梯度回传时，b 这条路是断的</text><rect x="40" y="442" width="440" height="106" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="476" font-size="18" fill="#c88735" font-weight="600" text-anchor="start">若用辅助损失</text><text x="64" y="504" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">L = L_main + α · L_balance</text><text x="64" y="532" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">均衡项进梯度，与主目标争夺优化方向</text><rect x="520" y="442" width="440" height="106" rx="12" fill="#edf7f2" stroke="none"/><text x="544" y="476" font-size="18" fill="#218575" font-weight="600" text-anchor="start">若用偏置项</text><text x="544" y="504" font-size="16" fill="#24334a" font-weight="400" text-anchor="start">b ← b ± γ（按负载，与梯度无关）</text><text x="544" y="532" font-size="15" fill="#6d7c90" font-weight="400" text-anchor="start">闭环控制器，改的是&quot;谁被选中&quot;，不是&quot;模型学什么&quot;</text></g></svg>