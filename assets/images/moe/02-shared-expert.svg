<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" role="img" aria-labelledby="title desc"><title id="title">通用知识：学一遍，还是被 N 个专家各学一遍</title><desc id="desc">路由专家池 15 个。左边没有共享专家，右边把通用知识拎出来单独放。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b3becc"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1000" height="616" rx="0" fill="#ffffff" stroke="none"/><text x="40" y="42" font-size="13" fill="#218575" font-weight="600" text-anchor="start">MATINFER / MOE / 02</text><text x="40" y="85" font-size="28" fill="#24334a" font-weight="600" text-anchor="start">通用知识：学一遍，还是被 N 个专家各学一遍</text><text x="40" y="119" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">路由专家池 15 个。左边没有共享专家，右边把通用知识拎出来单独放。</text><rect x="40" y="146" width="440" height="364" rx="12" fill="#f7f9fc" stroke="none"/><text x="64" y="182" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">纯路由专家池</text><text x="64" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">每个专家都私藏一份&quot;通用知识&quot;</text><rect x="520" y="146" width="440" height="364" rx="12" fill="#edf7f2" stroke="none"/><text x="544" y="182" font-size="20" fill="#24334a" font-weight="600" text-anchor="start">1 共享 + 15 路由</text><text x="544" y="208" font-size="14" fill="#6d7c90" font-weight="400" text-anchor="start">通用知识只此一份，路由专家专心做专门化</text><rect x="64" y="218" width="392" height="32" rx="8" fill="#fbf3e6" stroke="none"/><text x="84" y="240" font-size="15" fill="#c88735" font-weight="600" text-anchor="start">15 个专家，每个都含一份通用知识</text><rect x="544" y="218" width="392" height="32" rx="8" fill="#cfe8dd" stroke="none"/><text x="564" y="240" font-size="15" fill="#218575" font-weight="600" text-anchor="start">共享专家：通用知识，永远激活</text><rect x="64" y="262" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="68" y="266" width="50" height="22" rx="4