d0" stroke="none"/><text x="365" y="362" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="450" y="362" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="544" y="342" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="604" y="362" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="680" y="342" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="740" y="362" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="816" y="342" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="876" y="362" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="64" y="382" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="68" y="386" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="93" y="402" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="178" y="402" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="200" y="382" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="204" y="386" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="229" y="402" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="314" y="402" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="336" y="382" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="340" y="386" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="365" y="402" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="450" y="402" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="544" y="382" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="604" y="402" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="680" y="382" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="740" y="402" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="816" y="382" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="876" y="402" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="64" y="422" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="68" y="426" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="93" y="442" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="178" y="442" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="200" y="422" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="204" y="426" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="229" y="442" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="314" y="442" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="336" y="422" width="120" height="30" rx="6" fill="#eef1f6" stroke="none"/><rect x="340" y="426" width="50" height="22" rx="4" fill="#f3ddd0" stroke="none"/><text x="365" y="442" font-size="12" fill="#c88735" font-weight="500" text-anchor="middle">通用</text><text x="450" y="442" font-size="12" fill="#6d7c90" font-weight="400" text-anchor="end">专有</text><rect x="544" y="422" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="604" y="442" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="680" y="422" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="740" y="442" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><rect x="816" y="422" width="120" height="30" rx="6" fill="#eaf4ee" stroke="none"/><text x="876" y="442" font-size="13" fill="#6d7c90" font-weight="400" text-anchor="middle">专有</text><text x="64" y="484" font-size="16" fill="#c88735" font-weight="500" text-anchor="start">通用知识存了 15 份，真正用得上的只有 1 份</text><text x="544" y="484" font-size="16" fill="#218575" font-weight="500" text-anchor="start">通用知识只存 1 份，省下的容量全给专有知识</text><text x="40" y="548" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">共享专家是常驻的，占一份固定算力：给多了吃掉稀疏性，给少了装不下通用知识。</text><text x="40" y="576" font-size="17" fill="#6d7c90" font-weight="400" text-anchor="start">所以 V2 用 2 个共享专家，V3 减到 1 个 —— 路由池从 160 涨到 256 之后，常驻容量不再需要那么多。</text></g></svg>